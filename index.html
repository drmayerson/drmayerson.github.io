<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelletjes</title>
<meta name="description" content="Kleine spelletjes en projectjes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@800&display=swap">
<style>
:root{--bg:#f5f0fb;--panel:#fff;--ink:#35204a;--soft:#6c5784;--line:#e2d4f0;--accent:#d63c74;
  --display:"Grandstander","Trebuchet MS",system-ui,sans-serif;--body:"Andika","Trebuchet MS",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#150f28;--panel:#211839;--ink:#f3ecff;--soft:#b9a9d8;--line:#3b2f62;--accent:#ff6c9c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:56px max(16px,env(safe-area-inset-left,0px)) 56px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--display);font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0;color:var(--soft);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:20px;background:var(--panel);border:2px solid var(--line);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card h2{font-family:var(--display);font-size:1.4rem;margin:0}
.card .go{font-weight:700;color:var(--accent)}
.bow{height:10px;border-radius:5px;background:linear-gradient(90deg,#ff6b8b,#ffa45c,#ffd85c,#7ee08a,#6cc4ff,#b48cff)}
</style>
</head>
<body>
<main>
  <div style="display:flex;flex-direction:column;gap:10px">
    <h1>Spelletjes</h1>
    <p>Kleine spelletjes om mee te oefenen en te spelen. Klik er een aan om te beginnen.</p>
  </div>
  <div class="grid">
    <a class="card" href="eenhoornrace/">
      <div class="bow"></div>
      <h2>Eenhoornrace</h2>
      <p>Leer blind typen: typ Nederlandse woorden en galop met je eenhoorn en capibara door de regenboog. Voor een Belgisch AZERTY-toetsenbord.</p>
      <span class="go">Spelen →</span>
    </a>
  </div>
</main>
</body>
</html>
