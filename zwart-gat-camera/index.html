<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zwart gat camera</title>
<meta name="description" content="Bekijk jezelf door een draaiend zwart gat: je camerabeeld wordt live afgebogen volgens de algemene relativiteitstheorie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@400;500;700&display=swap">
<script src="teksten.js"></script>
<style>
:root{--panel:rgba(14,10,30,.84);--ink:#f3ecff;--soft:#c3b6e0;--line:rgba(190,170,240,.28);--accent:#ff6c9c;
  --display:"Unbounded","Helvetica Neue",Arial,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --logo-w:clamp(64px,8.5vw,124px);--logo-h:calc(var(--logo-w)*1.19)}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
/* touch screen: no double-tap zoom, no text selection or long-press menus on the picture */
html{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
.panel{touch-action:pan-y}
body{margin:0;background:#000;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* Einstein Telescope logo, top left, without a box: light on the picture with a soft shadow */
.brand{position:fixed;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:var(--logo-w);
  margin:0;pointer-events:none;z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(0,0,0,.35))}
.brand[hidden]{display:none}
.et-logo{display:block;width:100%;height:auto}
.et-word{fill:#fff}
/* tap controls for size and spin, right edge (like the exhibit) */
.dock{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:3;
  display:flex;align-items:center;gap:clamp(6px,1.4vw,18px);color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.dock[hidden]{display:none}
.dock-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.dock-col[hidden]{display:none}
.dock-btn{width:52px;height:52px;min-height:0;padding:0;border:0;border-radius:50%;background:transparent;color:#fff;display:flex;
  align-items:center;justify-content:center;opacity:.85;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.dock-btn:hover{border:0;opacity:1;background:rgba(255,255,255,.08)}
.dock-btn:active{background:rgba(255,255,255,.18)}
.dock-btn svg{width:26px;height:26px}
.dock-reset svg{width:24px;height:24px}
.dock-icon{display:flex;flex-direction:column;align-items:center;gap:2px}
.dock-icon svg{width:40px;height:40px}
.dock-val{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;opacity:.8;font-variant-numeric:tabular-nums}
.banner{position:fixed;top:64px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--accent);font-weight:700;text-align:center;z-index:5}
.banner[hidden]{display:none}
.banner.big{font-family:var(--display);font-weight:500;font-size:clamp(1.1rem,3.6vw,1.6rem)}
body.picking canvas{cursor:crosshair}
body.picking .panel,body.picking .dock{display:none}
body.shots canvas{cursor:copy}
body.idle,body.idle canvas{cursor:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6;
  font-family:var(--display);font-weight:700;font-size:min(40vh,40vw);line-height:1;color:#fff;
  text-shadow:0 0 .12em rgba(0,0,0,.65),0 .04em .3em rgba(0,0,0,.5)}
.count[hidden]{display:none}
.count span{animation:countPop 1s ease-out both}
.count span.snap{font-size:.4em;letter-spacing:.02em}
@keyframes countPop{0%{transform:scale(1.6);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.count span{animation:none}.flash.go{animation-duration:.01s}}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);
  padding:8px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:.92rem;z-index:5;pointer-events:none}
.toast[hidden]{display:none}
.qr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:6;pointer-events:none}
.qr[hidden]{display:none}
.qr-card{position:relative;pointer-events:auto;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:16px 22px;
  max-width:100%;max-height:100%;overflow:auto;padding:22px 22px 26px;border-radius:22px;background:#fff;color:#1b0f2c;
  box-shadow:0 12px 40px rgba(0,0,0,.55);text-align:center}
.qr-thumb{display:block;width:auto;height:auto;max-width:min(280px,36vw);max-height:min(280px,60vh);border-radius:12px;background:#000}
.qr-main{display:flex;flex-direction:column;align-items:center;gap:6px}
.qr-code{width:min(320px,40vw,58vh);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
@media (max-aspect-ratio:4/5){
  .qr-card{flex-direction:column}
  .qr-thumb{max-width:60vw;max-height:22vh}
  .qr-code{width:min(320px,72vw,44vh)}
}
.qr-code img{width:100%;height:100%;image-rendering:pixelated}
.qr-code .wait{font-weight:700;color:#5a4a7a}
.qr-title{margin:0;font-family:var(--display);font-weight:500;font-size:1.05rem;letter-spacing:.01em}
.qr-small{margin:0;color:#5a4a7a;font-size:.9rem;max-width:300px}
.qr-close{position:absolute;top:4px;right:4px;min-height:48px;width:48px;padding:0;border:0;background:transparent;color:#5a4a7a;font-size:1.6rem;line-height:1}
.qr-close:hover{color:#1b0f2c}
.qr-bar{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:0 0 22px 22px;overflow:hidden;background:#eee}
.qr-bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.qr-again{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:4;
  min-height:44px;min-width:44px;padding:6px 10px;border-radius:12px;background:rgba(20,14,38,.55);opacity:.6;font-family:var(--mono);font-size:.8rem}
.qr-again:hover,.qr-again:focus-visible{opacity:1}
.qr-again[hidden]{display:none}
.indent{padding-left:26px}
input[type=url],input[type=password]{font:inherit;width:100%;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:40px}
/* settings panel */
.panel{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:4;
  width:min(390px,calc(100vw - 24px));max-height:calc(100vh - 44px - var(--logo-h));overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px)}
/* the head row stays at the top while the settings scroll */
.row-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;z-index:2;
  margin:-14px -16px 0;padding:14px 16px 10px;background:rgba(14,10,30,.97);border-radius:18px 18px 0 0;border-bottom:1px solid var(--line)}
.panel.hidden .row-head{position:static;margin:0;padding:0;background:transparent;border:0}
.row-head strong{font-family:var(--display);font-weight:500;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase}
#toggle{display:flex;align-items:center;gap:6px}
#toggle svg{width:22px;height:22px;display:none}
/* hidden: only a small round gear button remains */
body.nologo .panel{max-height:calc(100vh - 24px)}
.panel.hidden{width:auto;padding:0;gap:0;background:transparent;border:0;backdrop-filter:none;overflow:visible}
.panel.hidden>*:not(.row-head){display:none}
.panel.hidden .row-head strong{display:none}
.panel.hidden #toggle{width:44px;height:44px;min-height:0;padding:0;justify-content:center;border-radius:50%;background:rgba(10,8,20,.5);opacity:.5}
.panel.hidden #toggle:hover,.panel.hidden #toggle:focus-visible{opacity:1}
.panel.hidden #toggle svg{display:block}
.panel.hidden .tog-text{display:none}
.langs{display:flex;gap:6px}
.vlangs{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:3}
.vlangs[hidden]{display:none}
.vlangs button{flex:none;width:48px;min-height:44px;background:rgba(10,8,20,.5);opacity:.75}
.vlangs button[aria-pressed=true]{opacity:1}
.info-btn{position:fixed;left:calc(max(12px,env(safe-area-inset-left,0px)) + 56px);bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:4;
  width:44px;height:44px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(10,8,20,.5);opacity:.75}
.info-btn svg{width:26px;height:26px}
.info-btn[hidden]{display:none}
.info{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:7;background:rgba(0,0,0,.45)}
.info[hidden]{display:none}
.info-card{position:relative;max-width:min(620px,100%);max-height:100%;overflow:auto;padding:22px 24px;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);color:var(--soft);font-size:1.05rem}
.info-card h2{margin:0 0 8px;color:var(--ink);font-family:var(--display);font-weight:500;font-size:1.2rem;letter-spacing:.02em}
.info-card p{margin:8px 0 0}
.info-card b{color:var(--ink)}
.info-close{position:absolute;top:6px;right:6px;width:48px;height:48px;min-height:0;padding:0;border:0;background:transparent;font-size:1.8rem;line-height:1}
.pinpad{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;background:rgba(0,0,0,.55)}
.pinpad[hidden]{display:none}
.pin-card{width:min(320px,calc(100vw - 32px));padding:18px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;gap:12px}
.pin-title{margin:0;font-family:var(--mono);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.pin-dots{display:flex;gap:10px;min-height:18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;background:var(--ink)}
.pin-dots.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pin-keys button{min-height:62px;font-family:var(--mono);font-size:1.4rem;font-weight:600;border-radius:16px}
.pin-keys button[data-k=ok]{background:var(--accent);border-color:var(--accent);color:#1b0f2c;font-size:1rem}
.pin-cancel{width:100%;min-height:48px}
.langs button{flex:1;min-height:34px;padding:4px 0;font-family:var(--mono);font-weight:600;font-size:.78rem;letter-spacing:.12em}
.langs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#1b0f2c}
label.check{flex-direction:row;align-items:flex-start;gap:8px;cursor:pointer}
label.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
fieldset{border:1px solid var(--line);border-radius:14px;margin:0;padding:8px 12px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-family:var(--mono);font-weight:600;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 6px}
select{font:inherit;width:100%;max-width:100%;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:40px}
select option{color:#000}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sub{display:flex;flex-direction:column;gap:10px}
.sub[hidden]{display:none}
.swatch{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);flex:none}
button{font-family:var(--display);font-weight:500;font-size:.8rem;letter-spacing:.03em;color:var(--ink);background:rgba(255,255,255,.08);
  border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#1b0f2c}
.btns{display:flex;flex-wrap:wrap;gap:8px}
label{display:flex;flex-direction:column;gap:4px}
.lab{display:flex;justify-content:space-between;gap:8px}
.lab span:last-child{color:var(--soft);font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.hint{color:var(--soft);font-size:.9rem;margin:0}
details{color:var(--soft);font-size:.92rem}
details p{margin:6px 0 0}
summary{cursor:pointer;color:var(--ink);font-family:var(--display);font-weight:500;font-size:.85rem;letter-spacing:.03em}
.msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.1rem}
.msg.show{display:flex}
</style>
</head>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
#define M_PI 3.14159265358979
#define D1MACH1 1.175494351e-38
#define D1MACH2 3.402823466e+38
#define D1MACH3 1e-7
uniform vec2  uResolution;
uniform vec2  uScreen;       // full screen width/height in lensing units
uniform vec2  uCamScale;     // full camera-image width/height in lensing units (cover fit)
uniform float M;             // black-hole mass (sets the size)
uniform float PsiScale;      // 1 = physical bending
uniform float uSpin;         // a/M
uniform float uInclination;  // radians
uniform float uRing;         // radius of the "starry" zone as a fraction of the shorter screen side
uniform float uTol;          // below this deflection the camera image fills the whole screen
uniform sampler2D textureft; // camera / demo image
uniform sampler2D texturebg; // star sky, equirectangular
uniform sampler2D uLensMap;  // precomputed map (display pass)
uniform float uBgMode;       // background removal: 0 off, 1 colour key, 2 person mask
uniform vec3  uKey;          // colour key: picked background colour (rgb)
uniform float uKeyTol;       // colour key: distance that still counts as background
uniform sampler2D uMask;     // person mask (1 = person), rows stored top-down
uniform float uShowMask;     // raw pass: tint the removed background
uniform sampler2D uBackdrop; // chosen background photo
uniform float uUseBackdrop;  // 1: removed background shows the photo instead of the sky
uniform vec2  uBdScale;      // cover fit of the photo onto the camera image

vec2 c_p(vec2 x, vec2 y){
    return vec2(x[0]+y[0], x[1]+y[1]);
}

vec2 c_m(vec2 x, vec2 y){
    return vec2(x[0]*y[0] - x[1]*y[1] , x[0]*y[1] + x[1]*y[0]);
}

vec2 c_d(vec2 x, vec2 y){
    return c_m(x, vec2(y[0], -y[1]))/(y[0]*y[0] + y[1]*y[1]);   // was pow(y,2.): undefined for y<0 in GLSL
}

vec2 c_pow(vec2 x, float y){
    float mag = pow(sqrt(x[0]*x[0] + x[1]*x[1]), y);
    float angle = y*(atan(x[1],x[0]));
    return vec2(mag*cos(angle), mag*sin(angle));
}

float DRF(float X, float Y, float Z){

    float ERRTOL = pow(4.0*D1MACH3, 1.0/6.0);
    float LOLIM  = 5.0 * D1MACH1;
    float UPLIM  = D1MACH2/5.0;
    float C1 = 1.0/24.0;
    float C2 = 3.0/44.0;
    float C3 = 1.0/14.0;

    float ans = 0.0;
    if(min(min(X,Y),Z) < 0.0) {
        return ans;
    }

    if(max(max(X,Y),Z) > UPLIM){
        return ans;
    }

    if(min(min(X+Y,X+Z),Y+Z) < LOLIM){
        return ans;
    }

    float XN = X;
    float YN = Y;
    float ZN = Z;
    float MU = 0.;
    float XNDEV = 0.;
    float YNDEV = 0.;
    float ZNDEV = 0.;

    for(int it_=0; it_<60; it_++){
        MU = (XN+YN+ZN)/3.0;
        XNDEV = 2.0 - (MU+XN)/MU;
        YNDEV = 2.0 - (MU+YN)/MU;
        ZNDEV = 2.0 - (MU+ZN)/MU;
        float EPSLON = max(max(abs(XNDEV),abs(YNDEV)),abs(ZNDEV));
        if(EPSLON < ERRTOL){break;}
        float XNROOT = sqrt(XN);
        float YNROOT = sqrt(YN);
        float ZNROOT = sqrt(ZN);
        float LAMDA = XNROOT*(YNROOT+ZNROOT) + YNROOT*ZNROOT;
        XN = (XN+LAMDA)*0.250;
        YN = (YN+LAMDA)*0.250;
        ZN = (ZN+LAMDA)*0.250;
    }

    float E2 = XNDEV*YNDEV - ZNDEV*ZNDEV;
    float E3 = XNDEV*YNDEV*ZNDEV;
    float S  = 1.0 + (C1*E2-0.10-C2*E3)*E2 + C3*E3;
    ans = S/sqrt(MU);

    return ans;
}

float rawF(float sinphi, float m){
    float sinphi2 = sinphi*sinphi;                 // was pow(sinphi,2.0): undefined for sinphi<0
    float drf = DRF(1. - sinphi2, 1. - m*sinphi2, 1.);
    return sinphi*drf;
}

float K(float m){ return DRF(0., 1. - m, 1.);}

float F(float phi, float m){
    if(abs(phi) > M_PI/2.0){
        // Abramowitz & Stegun (17.4.3)
        float phi2 = phi + M_PI/2.0;
        float angle = (phi2/M_PI);
        return 2.0*floor(phi2 / M_PI)*K(m) - rawF(cos((angle - floor(angle))*M_PI), m);
    }
    return rawF(sin(phi), m);
}

float psimax(float mag){
    // Roots of the Schwarzschild radial cubic  r^3 - b^2 r + 2 b^2 = 0  (b = mag > sqrt(27)):
    // three real roots v1 < 0 < v3 < v4.  Computed with the trigonometric formula.
    // (The previous version used complex cube roots whose branch depended on the
    // sign of a rounding-noise imaginary part, i.e. on the GPU/driver: on some
    // renderers it mislabelled the roots and every pixel turned to stars.)
    float pp = -mag*mag, qq = 2.0*mag*mag;
    float rr = 2.0*sqrt(-pp/3.0);
    float th = acos(clamp(1.5*qq/pp*sqrt(-3.0/pp), -1.0, 1.0))/3.0;
    float v4 = rr*cos(th);                      // largest root
    float v3 = rr*cos(th - 2.0*M_PI/3.0);       // middle root (> 0)
    float v1 = rr*cos(th - 4.0*M_PI/3.0);       // negative root

    float v32 = v3;
    float v41 = v4 - v1;
    float v31 = v3 - v1;
    float v42 = v4;

    float ellk = v32*v41 / (v31*v42);
    return 4.*mag*F(asin(sqrt(v31/v41)), ellk)/sqrt(v31*v42);
}

// ============================================================================
//  KERR LENSING  (Gralla & Lupsasca, "Lensing by Kerr black holes" and
//  "Null geodesics of the Kerr exterior").  Fully analytic: elliptic integrals
//  in Carlson form + Jacobi amplitude.  Validated against a numerical geodesic
//  integrator to ~1e-8 rad (double) and to <~0.03 webcam texel (float32).
//  All quantities in units of M (M = 1) inside these functions.
// ============================================================================
#define K_PI 3.14159265358979

// Carlson R_F(x,y,z), fixed iteration count (WebGL1-safe loop).
float kRF(float x, float y, float z){
    for (int i = 0; i < 6; i++) {
        float sx = sqrt(x), sy = sqrt(y), sz = sqrt(z);
        float l = sx*(sy + sz) + sy*sz;
        x = (x + l)*0.25; y = (y + l)*0.25; z = (z + l)*0.25;
    }
    float mu = (x + y + z)/3.0;
    float X = 1.0 - x/mu, Y = 1.0 - y/mu, Z = -(X + Y);
    float E2 = X*Y - Z*Z, E3 = X*Y*Z;
    return (1.0 - E2/10.0 + E3/14.0 + E2*E2/24.0 - 3.0*E2*E3/44.0)/sqrt(mu);
}

// Carlson R_C(x,y) = R_F(x,y,y), closed form (series near x = y).
float kRC(float x, float y){
    float q = x/y, t = 1.0 - q, g;
    if (abs(t) < 0.1) {
        g = 1.0 + t*(1.0/6.0 + t*(3.0/40.0 + t*(5.0/112.0 + t*(35.0/1152.0 + t*(63.0/2816.0)))));
    } else if (t > 0.0) {
        g = acos(sqrt(q))/sqrt(t);
    } else {
        float v = sqrt(-t);
        g = log(v + sqrt(q))/v;                 // asinh(v)/v
    }
    return g/sqrt(y);
}

// Carlson R_J(x,y,z,p), p > 0.
float kRJ(float x, float y, float z, float p){
    float s = 0.0, fac = 1.0;
    for (int i = 0; i < 6; i++) {
        float sx = sqrt(x), sy = sqrt(y), sz = sqrt(z);
        float l = sx*(sy + sz) + sy*sz;
        float al = p*(sx + sy + sz) + sx*sy*sz;
        s += fac*kRC(al*al, p*(p + l)*(p + l));
        fac *= 0.25;
        x = (x + l)*0.25; y = (y + l)*0.25; z = (z + l)*0.25; p = (p + l)*0.25;
    }
    float mu = (x + y + z + 2.0*p)/5.0;
    float X = (mu - x)/mu, Y = (mu - y)/mu, Z = (mu - z)/mu, P = (mu - p)/mu;
    float ea = X*(Y + Z) + Y*Z, eb = X*Y*Z, ec = P*P;
    float e2 = ea - 3.0*ec, e3 = eb + 2.0*P*(ea - ec);
    float e4 = (2.0*eb + P*(ea - 3.0*ec))*P, e5 = eb*ec;
    float S = 1.0 - 3.0*e2/14.0 + e3/6.0 + 9.0*e2*e2/88.0 - 3.0*e4/22.0
            - 9.0*e2*e3/52.0 + 3.0*e5/26.0;
    return 3.0*s + fac*S/(mu*sqrt(mu));
}

// Legendre F(phi|m), |phi| <= pi/2.
float kF(float phi, float m){
    float s = sin(phi), c = cos(phi);
    return s*kRF(c*c, 1.0 - m*s*s, 1.0);
}

// Legendre Pi(n;phi|m), |phi| <= pi/2, with eps = 1-n passed separately so that
// 1 - n sin^2 = cos^2 + eps sin^2 has no cancellation (pole-grazing rays).
float kPi(float n, float eps, float phi, float m){
    float s = sin(phi), c = cos(phi), s2 = s*s, c2 = c*c, d = 1.0 - m*s2;
    return s*kRF(c2, d, 1.0) + (n/3.0)*s*s2*kRJ(c2, d, 1.0, c2 + eps*s2);
}

// Complete Pi(n|m).
float kPiC(float n, float eps, float m){
    float d = 1.0 - m;
    return kRF(0.0, d, 1.0) + (n/3.0)*kRJ(0.0, d, 1.0, eps);
}

// Jacobi amplitude am(u|m) for m <= 0 (unwrapped, any real u).
// Uses sn(u|m) = sd(v|mu)/sqrt(1-m), cn(u|m) = cd(v|mu), v = u sqrt(1-m),
// mu = -m/(1-m) in [0,1) (A&S 16.10), and the descending AGM for am(v|mu).
float kAmNeg(float u, float m){
    float q  = sqrt(1.0 - m);
    float mu = -m/(1.0 - m);
    float a0 = 1.0, b0 = sqrt(1.0 - mu);
    float a1 = 0.5*(a0 + b0), c1 = 0.5*(a0 - b0), b1 = sqrt(a0*b0);
    float a2 = 0.5*(a1 + b1), c2 = 0.5*(a1 - b1), b2 = sqrt(a1*b1);
    float a3 = 0.5*(a2 + b2), c3 = 0.5*(a2 - b2);
    float ph = 8.0*a3*u*q;
    ph = 0.5*(ph + asin(clamp(c3/a3*sin(ph), -1.0, 1.0)));
    ph = 0.5*(ph + asin(clamp(c2/a2*sin(ph), -1.0, 1.0)));
    ph = 0.5*(ph + asin(clamp(c1/a1*sin(ph), -1.0, 1.0)));
    float j = floor(ph/K_PI + 0.5);
    float r = ph - j*K_PI;
    return j*K_PI + atan(sin(r), q*cos(r));
}

float kCbrt(float v){ return sign(v)*pow(abs(v), 1.0/3.0); }

// One Gauss-Legendre node (t, weight w on [0,1]) of the direct I_phi integral
// (without the overall factor 2a):  u = (1-t^2)/r4,
// integrand = (2 - a lam u) u (2/r4) / ((1 - 2u + a^2 u^2) sqrt((1-r1 u)(1-r2 u)(1-r3 u)))
// with 1 - r3 u written as (r43 + r3 t^2)/r4 (no cancellation).
float kIphiTerm(float t, float w, float lam, float a,
                float r1, float r2, float r3, float r4, float r43){
    float u = (1.0 - t*t)/r4;
    float num = (2.0 - a*lam*u)*u*2.0/r4;
    float den = (1.0 - 2.0*u + a*a*u*u)*sqrt((1.0 - r1*u)*(1.0 - r2*u)*(r43 + r3*t*t)/r4);
    return w*num/den;
}

// Kerr map for a distant observer with inclination (cth = cos, sth = sin) and
// Bardeen screen coordinates (al, be), spin a, M = 1.  Traces the ray back to the
// celestial sphere.  Returns false if it comes from the horizon (shadow).
// Outputs cos/sin of the source polar angle, the source azimuth relative to the
// observer's azimuth, and the polar "sweep" angle (= psimax when a = 0).
bool kerrCore(float al, float be, float a, float cth, float sth,
              out float cths, out float sths, out float phs, out float sweep){
    cths = 0.0; sths = 1.0; phs = 0.0; sweep = 0.0;
    // measure-zero screen lines: lambda = 0 (pole crossing), eta = 0 (equator)
    if (abs(be) < 1.0e-4) be = 1.0e-4;
    float lam = -al*sth;
    if (abs(lam) < 1.0e-4) lam = (lam < 0.0) ? -1.0e-4 : 1.0e-4;
    float eta = (al*al - a*a)*cth*cth + be*be;
    if (eta <= 0.0) return false;               // vortical: always inside the shadow

    // ---- radial roots (Ferrari / Cardano, KerrGeo Eq. RadialRoots) ----
    float A = a*a - eta - lam*lam;
    float B = 2.0*(eta + (lam - a)*(lam - a));
    float C = -a*a*eta;
    float P = -A*A/12.0 - C;
    float Q = -A/3.0*((A/6.0)*(A/6.0) - C) - B*B/8.0;
    float disc = (P/3.0)*(P/3.0)*(P/3.0) + (Q/2.0)*(Q/2.0);
    float s3;
    if (disc >= 0.0) {
        float sd = sqrt(disc);
        s3 = kCbrt(-Q/2.0 + sd) + kCbrt(-Q/2.0 - sd);
    } else {
        s3 = 2.0*sqrt(-P/3.0)*cos(atan(sqrt(-disc), -Q/2.0)/3.0);
    }
    float z2 = s3/2.0 - A/6.0;
    float z  = sqrt(max(z2, 1.0e-12));
    float ip = -A/2.0 - z2 + B/(4.0*z);
    float im = -A/2.0 - z2 - B/(4.0*z);
    float rp = 1.0 + sqrt(max(1.0 - a*a, 0.0));   // outer horizon
    float rm = a*a/rp;                             // inner horizon
    if (im < 0.0) return false;                    // r3, r4 complex: from horizon
    float sip = sqrt(max(ip, 0.0)), sim = sqrt(im);
    float r1 = -z - sip, r2 = -z + sip, r3 = z - sim, r4 = z + sim;
    if (r4 <= rp) return false;                    // turning point inside horizon

    // ---- radial integrals, ray from infinity to r4 and back (case 2) ----
    float r31 = r3 - r1, r41 = r4 - r1, r32 = r3 - r2, r42 = r4 - r2, r43 = 2.0*sim;
    float sq   = sqrt(r31*r42);
    float sphi = sqrt(r31/r41);                    // sin(phi_inf)
    float c2r  = r43/r41;                          // cos^2(phi_inf)
    float dr   = r43/r42;                          // 1 - k sin^2(phi_inf)
    float Fi   = sphi*kRF(c2r, dr, 1.0);           // F(phi_inf | k)
    float Ir   = 4.0*Fi/sq;                        // total Mino time I_r
    // Frame-dragging integral I_phi.
    float Iphi;
    if (r3 < 0.9*r4) {
        // Weak/moderate field: the paper's horizon partial fractions subtract two
        // nearly equal terms here (float32 loses most digits), so integrate
        // a(2r - a lam)/(Delta sqrt(R)) directly in u = 1/r = (1-t^2)/r4 with an
        // 8-point Gauss-Legendre rule on t in [0,1]; the integrand is smooth.
        Iphi = 0.0;
        Iphi += kIphiTerm(0.0198550717512319, 0.0506142681451881, lam, a, r1, r2, r3, r4, r43);
        Iphi += kIphiTerm(0.1016667612931866, 0.1111905172266872, lam, a, r1, r2, r3, r4, r43);
        Iphi += kIphiTerm(0.2372337950418355, 0.1568533229389436, lam, a, r1, r2, r3, r4, r43);
        Iphi += kIphiTerm(0.4082826787521751, 0.1813418916891810, lam, a, r1, r2, r3, r4, r43);
        Iphi += kIphiTerm(0.5917173212478249, 0.1813418916891810, lam, a, r1, r2, r3, r4, r43);
        Iphi += kIphiTerm(0.7627662049581645, 0.1568533229389436, lam, a, r1, r2, r3, r4, r43);
        Iphi += kIphiTerm(0.8983332387068134, 0.1111905172266872, lam, a, r1, r2, r3, r4, r43);
        Iphi += kIphiTerm(0.9801449282487681, 0.0506142681451881, lam, a, r1, r2, r3, r4, r43);
        Iphi *= 2.0*a;
    } else {
        // Near the critical curve: elliptic form (KerrGeo case 2, I_+- terms).
        float s3p = sphi*sphi*sphi;
        float rp3 = rp - r3, rp4 = rp - r4;
        float np_ = rp3*r41/(rp4*r31);
        float Pip = Fi + (np_/3.0)*s3p*kRJ(c2r, dr, 1.0, r43/(r4 - rp));
        float Ip  = 2.0*(-(2.0/sq)*(r43/(rp3*rp4))*Pip - (2.0/sq)*Fi/rp3);
        float rm3 = rm - r3, rm4 = rm - r4;
        float nm_ = rm3*r41/(rm4*r31);
        float Pim = Fi + (nm_/3.0)*s3p*kRJ(c2r, dr, 1.0, r43/(r4 - rm));
        float Im  = 2.0*(-(2.0/sq)*(r43/(rm3*rm4))*Pim - (2.0/sq)*Fi/rm3);
        Iphi = (2.0*a/(rp - rm))*((rp - a*lam/2.0)*Ip - (rm - a*lam/2.0)*Im);
    }

    // ---- angular integrals (written without 1/a so a -> 0 is regular) ----
    float w   = (a*a - eta - lam*lam)/2.0;         // a^2 Delta_theta
    float wm  = w - sqrt(w*w + a*a*eta);           // a^2 u_-  (< 0)
    float up  = -eta/wm;                           // u_+
    float eps = lam*lam/(a*a - wm);                // 1 - u_+  (exact identity)
    float km  = a*a*up/wm;                         // u_+/u_-  (<= 0)
    float s   = sqrt(-wm);                         // a sqrt(-u_-)
    float sgb = (be >= 0.0) ? 1.0 : -1.0;
    // observer-side amplitude: sin = cth/sqrt(u+); cos^2 from the exact identity
    // u+ - cos^2(th) = sin^2(th) beta^2/(a^2 cos^2(th) - a^2 u_-), which avoids the
    // float32 cancellation for rays arriving almost along the spin axis.
    float sno = cth/sqrt(up);
    float co2 = (sth*sth*be*be)/((a*a*cth*cth - wm)*up);
    float dno = 1.0 - km*sno*sno;
    float Fo  = sno*kRF(co2, dno, 1.0);
    float PiO = Fo + (up/3.0)*sno*sno*sno*kRJ(co2, dno, 1.0, co2 + eps*sno*sno);
    float PiC = kPiC(up, eps, km);
    float Psi = kAmNeg(Fo + sgb*s*Ir, km);         // source latitude amplitude
    float j   = floor(Psi/K_PI + 0.5);
    float PiPsi = 2.0*j*PiC + kPi(up, eps, Psi - j*K_PI, km);
    float Gphi  = sgb*(PiPsi - PiO)/s;
    cths = sqrt(up)*sin(Psi);
    sths = sqrt(max(1.0 - cths*cths, 0.0));
    phs  = -(Iphi + lam*Gphi);                     // phi_s - phi_o = -(I_phi + lambda G_phi)
    sweep = (0.5*K_PI/kRF(0.0, 1.0 - km, 1.0))*s*Ir;
    return true;
}

// Full camera geometry.  The camera sits at distance D along n_o (inclination
// uInclination, spin axis projected to screen-up).  Each pixel's ray, arriving at
// angle phi0 = asin(b/D), is treated as the ray of an observer at infinity along
// its own direction, so the a = 0 limit is EXACTLY the classic Schwarzschild
// mapping  S = sin(phi0 - deltapsi) (cos w, sin w).
// Returns false for shadow pixels; otherwise S = screen-plane components of the
// (PsiScale-scaled) source direction and defl = its unwrapped deflection angle.
bool kerrLens(float mag, float omega, float phi0, out vec3 S, out float defl){
    S = vec3(0.0, 0.0, 1.0); defl = 0.0;
    float a  = clamp(uSpin, 0.0, 0.999);
    float so = sin(uInclination), co = cos(uInclination);
    vec3 n_o = vec3(so, 0.0, co);
    vec3 e_a = vec3(0.0, 1.0, 0.0);                // screen x (Bardeen alpha)
    vec3 e_b = vec3(-co, 0.0, so);                 // screen y (projected spin axis)
    float cw = cos(omega), sw = sin(omega);
    float cp = cos(phi0),  sp = sin(phi0);
    vec3 u_w  = cw*e_a + sw*e_b;
    vec3 nf   = cp*n_o - sp*u_w;                   // photon direction at the camera
    vec3 bvec = (mag/M)*(sp*n_o + cp*u_w);         // impact vector, |bvec| = b/M
    float cthf = nf.z;
    float sthf = max(length(nf.xy), 1.0e-6);
    vec3 ex  = vec3(nf.xy/sthf, 0.0);
    vec3 eaf = vec3(-ex.y, ex.x, 0.0);
    vec3 ebf = vec3(-cthf*ex.x, -cthf*ex.y, sthf);
    float cths, sths, phs, sweep;
    if (!kerrCore(dot(bvec, eaf), dot(bvec, ebf), a, cthf, sthf, cths, sths, phs, sweep))
        return false;
    vec3 ns = sths*(cos(phs)*ex + sin(phs)*eaf) + vec3(0.0, 0.0, cths);
    vec3 nc = vec3(dot(ns, e_a), dot(ns, e_b), -dot(ns, n_o));   // camera frame
    vec3 dc = vec3(sp*cw, sp*sw, cp);                             // look direction
    // signed, unwrapped deflection about the Schwarzschild-like axis
    vec3 kref = vec3(sw, -cw, 0.0);
    vec3 c  = cross(dc, nc);
    float cl = length(c);
    float psi = atan(cl, dot(dc, nc));
    vec3 k = kref;
    if (cl > 1.0e-6) {
        k = c/cl;
        if (dot(k, kref) < 0.0) { k = -k; psi = -psi; }
    }
    float psiu = psi + 2.0*K_PI*floor((sweep - K_PI - psi)/(2.0*K_PI) + 0.5);
    if (abs(PsiScale - 1.0) > 1.0e-4) {          // artistic bending exaggeration
        float ang = PsiScale*psiu;
        nc = dc*cos(ang) + cross(k, dc)*sin(ang) + k*dot(k, dc)*(1.0 - cos(ang));
    }
    S = nc;
    defl = PsiScale*psiu;
    return true;
}


#define CAM_D 200.0

vec2 skyUV(vec3 n){
    // equirectangular: pole along screen-up, seam straight behind the viewer
    return vec2(0.5 + atan(n.x, n.z)/(2.0*M_PI), 1.0 - acos(clamp(n.y, -1.0, 1.0))/M_PI);
}

#ifndef MAP_PASS
// YCbCr chroma of an rgb colour
vec2 chromaOf(vec3 c){
    return vec2(-0.168736*c.r - 0.331264*c.g + 0.5*c.b, 0.5*c.r - 0.418688*c.g - 0.081312*c.b);
}
float lumaOf(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

// How much of camera pixel tc is foreground (1) rather than background (0).
// The colour key also cleans the key colour out of edge pixels (col).
float fgAlpha(vec2 tc, inout vec3 col){
    if (uBgMode < 0.5) return 1.0;
    float a;
    if (uBgMode < 1.5) {
        // colour key: mostly chroma (shadows on the screen keep their colour), a little luma
        vec2 kc = chromaOf(uKey), cc = chromaOf(col);
        float yk = lumaOf(uKey), yc = lumaOf(col);
        float d = length(vec3(cc - kc, 0.3*(yc - yk)));
        a = smoothstep(uKeyTol, 1.6*uKeyTol + 0.02, d);
        // spill: take the key's colour cast out of the semi-transparent edge pixels
        float kl = length(kc);
        if (kl > 0.02 && a < 1.0) {
            vec2 kd = kc/kl;
            cc -= kd*max(dot(cc, kd), 0.0)*(1.0 - a);
            col = clamp(vec3(yc + 1.402*cc.y, yc - 0.344136*cc.x - 0.714136*cc.y, yc + 1.772*cc.x), 0.0, 1.0);
        }
    } else {
        a = smoothstep(0.3, 0.7, texture2D(uMask, vec2(tc.x, 1.0 - tc.y)).r);
    }
    return a;
}

// Background picture at camera coordinate tc: it hangs where your room was, so it is
// lensed like you (and shown the right way round, not mirrored). Beyond its edges it
// continues mirrored, so there is never a seam.
vec3 backdropAt(vec2 tc){
    vec2 uv = vec2(0.5 - (tc.x - 0.5)*uBdScale.x, 0.5 + (tc.y - 0.5)*uBdScale.y);
    uv = 1.0 - abs(mod(uv, 2.0) - 1.0);
    return texture2D(uBackdrop, uv).rgb;
}
// What a ray arriving from direction n shows when it does not hit the camera image: the
// star sky, or (with a background picture) the picture all around, using the same
// projection as the camera image, also for light from behind the camera. So the photon
// ring (light that went once around the black hole) shows the same picture.
vec3 skyColor(vec3 n){
    if (uUseBackdrop > 0.5) return backdropAt(vec2(0.5 - CAM_D*n.x/uCamScale.x, 0.5 + CAM_D*n.y/uCamScale.y));
    return texture2D(texturebg, skyUV(n)).rgb;
}

// Camera pixel tc, whose ray arrives from direction n.  With background removal on,
// the background part of the camera image is replaced by the star sky in that same
// direction (or by the background picture), so the person floats in front of it.
vec4 camComposite(vec2 tc, vec3 n){
    vec3 col = texture2D(textureft, tc).rgb;
    float a = fgAlpha(tc, col);
    if (a > 0.996) return vec4(col, 1.0);
    vec3 bg = uUseBackdrop > 0.5 ? backdropAt(tc) : texture2D(texturebg, skyUV(n)).rgb;
    return vec4(mix(bg, col, a), 1.0);
}
#endif

#ifdef MAP_PASS
#define OUT_BLACK()    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0)
#define OUT_CAM(tc, n) gl_FragColor = vec4(tc, 1.0, n.z)
#define OUT_SKY(n)     gl_FragColor = vec4(n.x, n.y, 2.0, n.z)
#else
#define OUT_BLACK()    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0)
#define OUT_CAM(tc, n) gl_FragColor = camComposite(tc, n)
#define OUT_SKY(n)     gl_FragColor = vec4(skyColor(n), 1.0)
#endif

#if defined(DISPLAY_PASS)
void main(){
    vec4 m = texture2D(uLensMap, gl_FragCoord.xy / uResolution);
    if (m.z < 0.5)      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
    else if (m.z < 1.5) {
        // rebuild the ray direction from the camera coordinate (inverse of the map
        // pass); the map keeps n.z in its fourth channel
        vec2 p = (0.5 - m.xy)*uCamScale;
        gl_FragColor = camComposite(m.xy, vec3(p.x/CAM_D, -p.y/CAM_D, m.w));
    }
    else                gl_FragColor = vec4(skyColor(vec3(m.x, m.y, m.w)), 1.0);   // map keeps n
}
#elif defined(RAW_PASS)
// plain (mirrored) camera image without the black hole: to pick the key colour, and
// (uShowMask) to show what is taken as background, tinted purple
void main(){
    vec2 xy = uScreen*(gl_FragCoord.xy/uResolution - 0.5);
    vec2 tc = vec2(0.5 - xy.x/uCamScale.x, 0.5 + xy.y/uCamScale.y);
    vec3 col = texture2D(textureft, tc).rgb;
    if (uShowMask > 0.5) col = mix(vec3(0.38, 0.0, 0.34), col, fgAlpha(tc, col));
    gl_FragColor = vec4(col, 1.0);
}
#else
void main(){
    float x = uScreen.x*(gl_FragCoord.x/uResolution.x - 0.5);
    float y = uScreen.y*(gl_FragCoord.y/uResolution.y - 0.5);
    float mag = length(vec2(x, y));
    bool useKerr = uSpin >= 1.0e-4;
    if (!useKerr && mag*mag <= 27.0*M*M) { OUT_BLACK(); return; }
    float omega = atan(y, x);
    float phi0  = asin(clamp(mag/CAM_D, 0.0, 1.0));
    vec3 n; float defl;
    if (useKerr) {
        if (!kerrLens(mag, omega, phi0, n, defl)) { OUT_BLACK(); return; }
    } else {
        float dps = psimax(mag/M) - M_PI;
        float vb  = phi0 - dps*PsiScale;
        n = vec3(sin(vb)*cos(omega), sin(vb)*sin(omega), cos(vb));
        defl = dps*PsiScale;
    }
    float newx =  CAM_D*n.x;
    float newy = -CAM_D*n.y;
    vec2 tc = vec2(1.0 - (newx/uCamScale.x + 0.5), 1.0 - (newy/uCamScale.y + 0.5));   // mirrored, like a mirror
    float Rfov = min(uScreen.x, uScreen.y)*uRing;
    bool inCircle = length(vec2(newx, newy)) < Rfov;
    bool barely   = abs(defl) < uTol;
    bool inRect   = tc.x >= 0.0 && tc.x <= 1.0 && tc.y >= 0.0 && tc.y <= 1.0;
    if (inCircle || (barely && inRect)) { OUT_CAM(tc, n); }
    else                                { OUT_SKY(n); }
}
#endif
</script>

<script>
(function(){
"use strict";
const KEY = 'zwart-gat-camera-instellingen';
const canvas = document.getElementById('c');
const msg = document.getElementById('msg');
// ---------- languages (all texts are in teksten.js) ----------
const TXT = window.ZGC_TEXT || {nl: {}};
let lang = 'nl';
try { const s0 = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s0 && s0.remember !== false && TXT[s0.lang]) lang = s0.lang; } catch (e) {}
function t(k, v){
  let s = TXT[lang] && TXT[lang][k] != null ? TXT[lang][k] : TXT.nl && TXT.nl[k] != null ? TXT.nl[k] : k;
  if (v) s = s.replace(/\{(\w+)\}/g, (m, n) => (n in v ? String(v[n]) : m));

}
function applyStaticText(){

    const [a, k] = pair.split(':'); e.setAttribute(a, t(k));

  document.querySelectorAll('.langs [data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
applyStaticText();
function fail(m){ msg.textContent = m; msg.classList.add('show'); }

let gl = canvas.getContext('webgl2', {antialias:false, premultipliedAlpha:false});
const isGL2 = !!gl;
if (!gl) gl = canvas.getContext('webgl', {antialias:false, premultipliedAlpha:false});
if (!gl) { fail(t('noWebGL')); return; }

// ---------- shaders ----------
const fragSrc = document.getElementById('frag').textContent;
const vertSrc = 'attribute vec2 pos; void main(){ gl_Position = vec4(pos, 0.0, 1.0); }';
function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(defs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, defs + fragSrc));
  gl.bindAttribLocation(p, 0, 'pos'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return {p, u};
}
let progDirect, progRaw, progMap = null, progDisp = null;
try { progDirect = program(''); progRaw = program('#define RAW_PASS\n'); }
catch (e) { console.error(e); fail(t('glFail')); return; }

const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ---------- textures ----------
function makeTex(wrapS){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrapS);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const camTex = makeTex(gl.CLAMP_TO_EDGE);
const skyTex = makeTex(gl.REPEAT);     // power-of-two, wraps around in longitude
const maskTex = makeTex(gl.CLAMP_TO_EDGE);
function uploadMask(bytes, w, h){        // one byte per pixel, rows top-down, 255 = person
  gl.bindTexture(gl.TEXTURE_2D, maskTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, w, h, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, bytes);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
}
uploadMask(new Uint8Array([255]), 1, 1);
const bdTex = makeTex(gl.CLAMP_TO_EDGE);     // chosen background picture
function upload(tex, src){
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}

// Generated star sky (equirectangular, 4096 x 2048): faint nebula + stars,
// built from directions on the sphere so it has no seams and no pole stretching.
function rng(seed){ return function(){ seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; }; }
function makeSky(){
  const W = 4096, H = 2048, r = rng(20261029);
  const sw = 512, sh = 256, small = document.createElement('canvas'); small.width = sw; small.height = sh;
  const sctx = small.getContext('2d'), img = sctx.createImageData(sw, sh);
  const blobs = [];
  for (let i = 0; i < 46; i++) {
    const z = 2*r() - 1, ph = 2*Math.PI*r(), s = Math.sqrt(1 - z*z);
    const hue = r();
    blobs.push({x: s*Math.cos(ph), y: z, z: s*Math.sin(ph), k: 4 + 30*r(), a: 0.35 + 0.65*r(),
      c: hue < 0.55 ? [40, 80, 190] : hue < 0.8 ? [120, 50, 150] : [170, 70, 60]});
  }
  for (let j = 0; j < sh; j++) {
    const th = (j + 0.5)/sh*Math.PI, ny = Math.cos(th), st = Math.sin(th);
    for (let i = 0; i < sw; i++) {
      const lo = ((i + 0.5)/sw - 0.5)*2*Math.PI, nx = st*Math.sin(lo), nz = st*Math.cos(lo);
      let R = 6, G = 8, B = 22;
      for (const b of blobs) {
        const w = b.a*Math.exp(b.k*(b.x*nx + b.y*ny + b.z*nz - 1));
        R += w*b.c[0]*0.45; G += w*b.c[1]*0.45; B += w*b.c[2]*0.45;
      }
      const o = 4*(j*sw + i);
      img.data[o] = Math.min(255, R); img.data[o+1] = Math.min(255, G); img.data[o+2] = Math.min(255, B); img.data[o+3] = 255;
    }
  }
  sctx.putImageData(img, 0, 0);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.drawImage(small, 0, 0, W, H);
  // stars: uniform on the sphere, drawn as ellipses widened by 1/sin(theta)
  for (let i = 0; i < 9000; i++) {
    const z = 2*r() - 1, lo = 2*Math.PI*r(), th = Math.acos(z);
    const x = lo/(2*Math.PI)*W, y = th/Math.PI*H, st = Math.max(Math.sin(th), 0.03);
    const m = Math.pow(r(), 6), rad = 0.7 + 2.6*m, al = 0.35 + 0.65*Math.sqrt(m);
    const t = r(), col = t < 0.15 ? '255,210,170' : t < 0.35 ? '190,215,255' : '255,255,250';
    ctx.fillStyle = 'rgba(' + col + ',' + al.toFixed(3) + ')';
    for (const dx of [0, -W, W]) {
      ctx.beginPath(); ctx.ellipse(x + dx, y, Math.min(rad/st, W/4), rad, 0, 0, 2*Math.PI); ctx.fill();
    }
  }
  return c;
}

// Demo picture, used until the camera is switched on.
function makeDemo(){
  const W = 1280, H = 960, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const cols = ['#e0485e', '#3fae5a', '#3d6fe0', '#e8c43c'];
  for (let q = 0; q < 4; q++) { ctx.fillStyle = cols[q]; ctx.fillRect((q % 2)*W/2, (q < 2 ? 0 : 1)*H/2, W/2, H/2); }
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 6;
  for (let x = 0; x <= W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 8;
  ctx.font = '700 104px Unbounded, Helvetica, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeText(t('demoTitle'), W/2, H*0.2); ctx.fillText(t('demoTitle'), W/2, H*0.2);
  ctx.font = '700 64px "Atkinson Hyperlegible", Helvetica, Arial, sans-serif';
  ctx.strokeText(t('demoSub'), W/2, H*0.82); ctx.fillText(t('demoSub'), W/2, H*0.82);
  // image is mirrored on screen (like a mirror), so flip the text once here
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const mc = m.getContext('2d'); mc.translate(W, 0); mc.scale(-1, 1); mc.drawImage(c, 0, 0);
  return m;
}

upload(skyTex, makeSky());
let demo = makeDemo();
upload(camTex, demo);
let camAspect = demo.height/demo.width;
// the demo text is drawn on a canvas, so redraw it once the web font has arrived
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  demo = makeDemo(); if (!useVideo) upload(camTex, demo);
}).catch(() => {});

// ---------- lens map (precomputed once per setting) ----------
let mapTex = null, mapFbo = null, mapType = null, mapW = 0, mapH = 0;
(function setupMap(){
  // float (or else half-float) render target; otherwise fall back to direct rendering
  let type = null, internal = gl.RGBA;
  if (isGL2) {
    if (gl.getExtension('EXT_color_buffer_float')) { type = gl.FLOAT; internal = gl.RGBA32F; }
    else if (gl.getExtension('EXT_color_buffer_half_float')) { type = gl.HALF_FLOAT; internal = gl.RGBA16F; }
  } else if (gl.getExtension('OES_texture_float') && gl.getExtension('WEBGL_color_buffer_float')) { type = gl.FLOAT; }
  else {
    const h = gl.getExtension('OES_texture_half_float');
    if (h && gl.getExtension('EXT_color_buffer_half_float')) type = h.HALF_FLOAT_OES;
  }
  if (!type) return;
  try {
    progMap = program('#define MAP_PASS\n'); progDisp = program('#define DISPLAY_PASS\n');
    mapType = {type, internal};
  } catch (e) { console.warn('lens map unavailable, direct rendering', e); progMap = progDisp = null; }
})();
function allocMap(w, h){
  if (!mapType) return false;
  if (mapTex && mapW === w && mapH === h) return true;
  if (!mapTex) { mapTex = gl.createTexture(); mapFbo = gl.createFramebuffer(); }
  gl.bindTexture(gl.TEXTURE_2D, mapTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

const D = 200, XSCALE = D*Math.cos(0.3);
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(canvas.clientWidth*dpr), h = Math.round(canvas.clientHeight*dpr);
  const maxPx = 2.4e6, k = Math.min(1, Math.sqrt(maxPx/(w*h)));

}

// Screen and camera-image size in lensing units.
function geom(){
  // Same geometry as the exhibit: the shorter screen side spans XSCALE lensing units
  // (the kiosk's portrait width); the corners must stay within the camera distance D.
  const W = canvas.width, H = canvas.height;
  let xs, ys;
  if (W <= H) { xs = XSCALE; ys = XSCALE*H/W; } else { ys = XSCALE; xs = XSCALE*W/H; }
  const half = Math.hypot(xs, ys)/2, lim = 195;
  if (half > lim) { xs *= lim/half; ys *= lim/half; }
  // camera image "covers" the screen without stretching
  const cw = Math.max(xs, ys/camAspect), ch = cw*camAspect;
  return {W, H, xs, ys, cw, ch};
}

// background removal currently in effect: 0 off, 1 colour key, 2 person mask
function activeBgMode(){
  const m = bgMode.value;
  if (m === 'green') return 1;
  if (m !== 'off' && useVideo && maskReady) return 2;
  return 0;
}

function setUniforms(P){
  gl.useProgram(P.p);
  const {W, H, xs, ys, cw, ch} = geom();
  const set1 = (n, v) => { if (P.u[n]) gl.uniform1f(P.u[n], v); };
  if (P.u.uResolution) gl.uniform2f(P.u.uResolution, W, H);
  if (P.u.uScreen) gl.uniform2f(P.u.uScreen, xs, ys);
  if (P.u.uCamScale) gl.uniform2f(P.u.uCamScale, cw, ch);
  set1('M', Number(mass.value)); set1('PsiScale', 1.0);
  set1('uSpin', Number(spin.value)); set1('uInclination', Number(incl.value)*Math.PI/180);
  // Starry zone: circle of half the shorter side (as in the exhibit). Outside it the camera
  // image fills the screen wherever the bending is small; that threshold scales with the
  // size of the black hole (weak-field bending 4M/b at the circle's edge, plus margin), so
  // no stray ring of stars appears at any size or screen shape.
  const Rfov = 0.5*Math.min(xs, ys), Mv = Number(mass.value);
  set1('uRing', 0.5); set1('uTol', 1.3*4*Mv/Rfov);
  set1('uBgMode', activeBgMode()); set1('uKeyTol', Number(keyTol.value));
  set1('uShowMask', showMask.checked && !picking ? 1 : 0);
  // background picture: cover the camera image, keep the picture's proportions
  set1('uUseBackdrop', bdReady && bdChoice.value !== 'sterren' && bgMode.value !== 'off' ? 1 : 0);
  if (P.u.uBdScale) { const r = bdAspect/camAspect; gl.uniform2f(P.u.uBdScale, r > 1 ? 1 : r, r > 1 ? 1/r : 1); }
  if (P.u.uBackdrop) gl.uniform1i(P.u.uBackdrop, 4);
  if (P.u.uKey) gl.uniform3f(P.u.uKey, keyRGB[0]/255, keyRGB[1]/255, keyRGB[2]/255);
  if (P.u.textureft) gl.uniform1i(P.u.textureft, 0);
  if (P.u.texturebg) gl.uniform1i(P.u.texturebg, 1);
  if (P.u.uLensMap) gl.uniform1i(P.u.uLensMap, 2);
  if (P.u.uMask) gl.uniform1i(P.u.uMask, 3);
}

// ---------- background removal ----------
// Three "smart" modes:
//  booth : background model that learns by itself which pixels never change, guided by a
//          person-recognition network (DeepLab, also run on zoomed-in tiles so that small,
//          distant people are found). Anything that differs from the background is shown,
//          at any distance; the network also fills holes (clothes the colour of the wall).
//  ai    : person recognition only (MediaPipe selfie model), for one person close by.
//  plate : background model from a recorded empty scene, no network (works offline).
// The networks run in a Web Worker so the black hole keeps running smoothly.
const usesPlate = () => bgMode.value === 'plate' || bgMode.value === 'booth';

const proc = document.createElement('canvas');

function sizeProc(){
  const w = PROC_W, h = Math.max(1, Math.round(PROC_W*video.videoHeight/video.videoWidth));
  if (proc.width === w && proc.height === h && BR) return false;
  proc.width = w; proc.height = h;
  const n = w*h, f = () => new Float32Array(n);

    const r = px[j], g = px[j+1], b = px[j+2], dr = r - CR[i], dg = g - CG[i], db = b - CB[i];

const VAR0 = 24, VAR_MIN = 12;            // noise variance (sum over r,g,b) of a working pixel

// -- recording an empty scene (button), for 'plate' and as a clean start for 'booth'
const CAP_FRAMES = 15;
let capTimer = null, cap = null;
function cancelCapture(){
  if (capTimer) { clearInterval(capTimer); capTimer = null; hideBanner(); }

}
el('plateBtn').addEventListener('click', () => {
  if (!useVideo) { updateNote(); return; }
  cancelCapture();
  let left = 3;
  showBanner(t('stepOut', {n: left}), {big: true, cancel: true});
  capTimer = setInterval(async () => {
    left--;
    if (left > 0) { showBanner(t('stepOut', {n: left}), {big: true, cancel: true}); return; }
    clearInterval(capTimer); capTimer = null;
    showBanner(t('capturing'), {big: true});
    if (lockCam.checked) await lockCamera(true);
    setTimeout(() => {
      sizeProc();
      const n = proc.width*proc.height;

function captureStep(){
  const n = proc.width*proc.height;
  for (let i = 0; i < n; i++) {
    cap.r[i] += CR[i]; cap.g[i] += CG[i]; cap.b[i] += CB[i];
    cap.q[i] += CR[i]*CR[i] + CG[i]*CG[i] + CB[i]*CB[i];
  }
  if (--cap.left > 0) return;
  const N = CAP_FRAMES;
  for (let i = 0; i < n; i++) {
    const r = cap.r[i]/N, g = cap.g[i]/N, b = cap.b[i]/N;
    BR[i] = r; BG[i] = g; BB[i] = b;
    bVar[i] = Math.max(VAR_MIN, cap.q[i]/N - r*r - g*g - b*b);
    bCount[i] = 600;
  }
  boxBlur(bVar, T1, proc.width, proc.height, 3);
  pmask.fill(0); gA = [1, 1, 1]; gB = [0, 0, 0]; plateValid = true; cap = null;
  showBanner(t('capDone'), {big: true}); setTimeout(hideBanner, 1800);

}
el('relearnBtn').addEventListener('click', () => {

// -- one camera frame through the background model
function plateStep(){
  const booth = bgMode.value === 'booth';

  const w = proc.width, h = proc.height, n = w*h;
  readFrame();
  if (cap) { captureStep(); return; }
  if (!plateValid) {
    if (!booth) return;                   // 'plate' needs a recorded empty scene
    // booth: start learning from the current frame (after locking the camera)
    const now = performance.now();
    if (!learnStartAt) { learnStartAt = now + (lockCam.checked ? 800 : 0); if (lockCam.checked) lockCamera(true); }
    if (now < learnStartAt) return;

    if (worker && !workerError && !aiMask && now < learnStartAt + 15000) return;
    BR.set(CR); BG.set(CG); BB.set(CB); bVar.fill(VAR0); bCount.fill(1); pmask.fill(0);

  const C = [CR, CG, CB], Bk = [BR, BG, BB];

      const x = X[i], y = Y[i]; cnt++; sx += x; sy += y; sxx += x*x; sxy += x*y;
    }
    if (cnt < 0.025*n) continue;
    const mx = sx/cnt, my = sy/cnt, vx = sxx/cnt - mx*mx;
    let A = vx > 100 ? (sxy/cnt - mx*my)/vx : my/Math.max(1, mx);
    A = Math.min(2, Math.max(0.5, A));
    const B = Math.min(60, Math.max(-60, my - A*mx));

  const f = Math.pow(2, (5 - Number(plateSens.value))/2.5), shadow = shadows.checked;
  for (let i = 0; i < n; i++) {
    const r = g0*BR[i] + o0, g = g1*BG[i] + o1, b = g2*BB[i] + o2, cr = CR[i], cg = CG[i], cb = CB[i];
    const dr = cr - r, dg = cg - g, db = cb - b;
    let d2 = dr*dr + dg*dg + db*db;
    if (shadow) {                         // darker but same colour: a shadow, not a person
      const bb = r*r + g*g + b*b;
      if (bb > 400) {
        const al = (cr*r + cg*g + cb*b)/bb;
        if (al > 0.45 && al < 1.0) {

  const kSlow = booth ? 1/600 : 1/1500;   // ~20 s resp. ~50 s at 30 frames per second

  // nobody (a moved chair, the spot where someone stood at the start), is absorbed quickly.
  const ABSORB = 0.03;

// Remove small specks of foreground and fill small holes inside foreground (4-connected).
function cleanMask(bin, w, h){
  const n = w*h, minBlob = Math.max(20, n*0.0015), maxHole = n*0.015;
  for (let pass = 0; pass < 2; pass++) {
    const v = pass === 0 ? 1 : 0;
    pseen.fill(0);
    for (let s0 = 0; s0 < n; s0++) {
      if (bin[s0] !== v || pseen[s0]) continue;
      let top = 0, cnt = 0, border = false;
      pstack[top++] = s0; pseen[s0] = 1;
      while (top) {
        const p = pstack[--top]; plist[cnt++] = p;
        const x = p % w;
        if (x === 0 || x === w - 1 || p < w || p >= n - w) border = true;
        if (x > 0     && bin[p - 1] === v && !pseen[p - 1]) { pseen[p - 1] = 1; pstack[top++] = p - 1; }
        if (x < w - 1 && bin[p + 1] === v && !pseen[p + 1]) { pseen[p + 1] = 1; pstack[top++] = p + 1; }
        if (p >= w    && bin[p - w] === v && !pseen[p - w]) { pseen[p - w] = 1; pstack[top++] = p - w; }
        if (p < n - w && bin[p + w] === v && !pseen[p + w]) { pseen[p + w] = 1; pstack[top++] = p + w; }
      }
      if (pass === 0 ? cnt < minBlob : (!border && cnt < maxHole))
        for (let k = 0; k < cnt; k++) bin[plist[k]] = 1 - v;
    }

}
// separable box blur of radius r, in place (tmp is scratch space of the same size)
function boxBlur(a, tmp, w, h, r){
  const inv = 1/(2*r + 1);
  for (let y = 0; y < h; y++) {
    const o = y*w; let s = 0;
    for (let x = -r; x <= r; x++) s += a[o + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++) {
      tmp[o + x] = s*inv;
      s += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {
    let s = 0;
    for (let y = -r; y <= r; y++) s += tmp[Math.min(h - 1, Math.max(0, y))*w + x];
    for (let y = 0; y < h; y++) {
      a[y*w + x] = s*inv;
      s += tmp[Math.min(h - 1, y + r + 1)*w + x] - tmp[Math.max(0, y - r)*w + x];

// -- person recognition in a Web Worker
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const WORKER_SRC = `
let seg = null, cls = -1;
const store = {};                         // latest mask per image region
async function loadLib(base){
  // the CommonJS build works in a classic worker (the ES module build needs importScripts,
  // which module workers lack); the CDN serves it with a non-script MIME type, hence the blob

}

    try {
      const mp = await loadLib(d.lib);
      const files = await mp.FilesetResolver.forVisionTasks(d.lib + '/wasm');
      const opts = delegate => ({baseOptions: {modelAssetPath: d.model, delegate}, runningMode: 'IMAGE',
        outputCategoryMask: false, outputConfidenceMasks: true});
      // the large model runs on the processor: on the graphics chip it competes with
      // drawing the black hole (measured: 60 -> 12 frames per second on a laptop)
      const order = d.prefer === 'CPU' ? ['CPU', 'GPU'] : ['GPU', 'CPU'];
      let delegate = order[0];
      try { seg = await mp.ImageSegmenter.createFromOptions(files, opts(order[0])); }
      catch (err) { delegate = order[1]; seg = await mp.ImageSegmenter.createFromOptions(files, opts(order[1])); }

    } catch (err) { self.postMessage({type: 'error', message: String(err && err.message || err)}); }

    try {
      for (const reg of d.rects) {
        const r = reg.r, sw = r[2]*W, sh = r[3]*H;
        const crop = await createImageBitmap(bm, r[0]*W, r[1]*H, sw, sh,
          {resizeWidth: d.inW, resizeHeight: Math.max(1, Math.round(d.inW*sh/sw)), resizeQuality: 'medium'});

          const ms = res.confidenceMasks, m = cls < 0 ? ms[ms.length - 1] : ms[cls];

  } catch (e) { workerError = String(e); worker = null; updateNote(); return; }

async function sendAI(){

  try {
    const bm = await createImageBitmap(video);
    if (!worker) { bm.close(); return; }
    worker.postMessage({type: 'frame', bitmap: bm, rects, outW: proc.width, outH: proc.height, inW: m.inW}, [bm]);

  else if (m === 'booth') bgNote(t('boothNote') + ' ' + (aiStatus() || t('aiHelps')) +
    (workerError ? ' ' + t('boothOnlyLearned') : '') + (plateValid ? '' : ' ' + t('starting')));
  else if (m === 'ai') bgNote((aiStatus() ? aiStatus() + ' ' : '') + (workerError ? t('aiTryPlate')
    : t('aiNote')));

    : t('plateNeed'));
}

  const m = bgMode.value;

// (a) green screen: pick the key colour by clicking on the plain camera image

canvas.addEventListener('click', e => {
  if (!picking) { if (shotsOn.checked) takeShot(); return; }
  const r = canvas.getBoundingClientRect();
  const {xs, ys, cw, ch} = geom();
  // same mapping as the RAW_PASS shader (screen -> mirrored camera coordinate)
  const x = xs*((e.clientX - r.left)/r.width - 0.5), y = ys*(0.5 - (e.clientY - r.top)/r.height);
  const u = 0.5 - x/cw, v = 0.5 + y/ch;           // texture coordinate, v up
  const src = useVideo ? video : demo;
  const sw = useVideo ? video.videoWidth : demo.width, sh = useVideo ? video.videoHeight : demo.height;
  if (!sw || !sh) return;
  const cx = Math.round(u*sw), cy = Math.round((1 - v)*sh), R = 4;
  pickCan.width = 2*R + 1; pickCan.height = 2*R + 1;
  const c = pickCan.getContext('2d', {willReadFrequently: true});
  c.drawImage(src, cx - R, cy - R, 2*R + 1, 2*R + 1, 0, 0, 2*R + 1, 2*R + 1);
  const d = c.getImageData(0, 0, 2*R + 1, 2*R + 1).data;
  let s = [0, 0, 0], k = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i+3] > 0) { s[0] += d[i]; s[1] += d[i+1]; s[2] += d[i+2]; k++; }
  if (k) { keyRGB = s.map(t => Math.round(t/k)); labels(); save(); }
  stopPicking();
});

// ---------- small key-value store (IndexedDB): own background picture, photo folder ----------
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('zwart-gat-camera', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k){
  const db = await idbOpen();
  return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite'), st = t.objectStore('kv');
    if (v == null) st.delete(k); else st.put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

let toastTimer = null;

// Optional countdown on screen before the photo (not in the photo itself). Esc cancels it.
let counting = false, countCancel = null;
function countdown(){
  return new Promise(resolve => {
    const box = el('count'); let n = 3, timer = null;
    const show = (t, snap) => { box.innerHTML = '<span' + (snap ? ' class="snap"' : '') + '>' + t + '</span>'; };
    const done = ok => { clearTimeout(timer); countCancel = null; box.hidden = true; box.innerHTML = ''; resolve(ok); };
    countCancel = () => done(false);
    box.hidden = false; show(n);
    const tick = () => {
      n--;
      if (n > 0) { show(n); timer = setTimeout(tick, 1000); }
      else { show(t('snap'), true); timer = setTimeout(() => done(true), 350); }   // photo right after "klik!"
    };
    timer = setTimeout(tick, 1000);
  });
}
async function takeShot(){
  if (shotBusy || shotPending || counting) return;
  if (!shotLocal.checked && !shotQR.checked) { toast(t('chooseSave')); return; }
  hideQR();
  // ask for permission to write in the folder now, while the click still counts
  if (shotLocal.checked && shotDir) {
    try {
      let p = await shotDir.queryPermission({mode: 'readwrite'});
      if (p !== 'granted') p = await shotDir.requestPermission({mode: 'readwrite'});
      if (p !== 'granted') toast(t('noFolderPerm', {name: shotDir.name}));
    } catch (e) { console.warn(e); }
  }
  if (el('shotCount').checked) {
    counting = true;
    const ok = await countdown();
    counting = false;
    if (!ok) return;
  }

  const f = el('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
// called in the render loop right after drawing, while the picture is still in the buffer
function grabShot(){
  shotPending = false; shotBusy = true;
  const W = canvas.width, H = canvas.height, px = new Uint8Array(W*H*4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), img = x.createImageData(W, H), row = W*4;
  for (let y = 0; y < H; y++) img.data.set(px.subarray((H - 1 - y)*row, (H - y)*row), y*row);   // GL rows are bottom-up
  x.putImageData(img, 0, 0);
  // small copy to show next to the QR code, so visitors recognise their own photo
  const t = document.createElement('canvas'), k = 320/Math.max(W, H);
  t.width = Math.max(1, Math.round(W*k)); t.height = Math.max(1, Math.round(H*k));
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  const thumb = t.toDataURL('image/jpeg', 0.8);
  c.toBlob(b => handleShot(b, thumb).catch(e => console.error(e)).finally(() => { shotBusy = false; }), 'image/jpeg', 0.92);
}
let lastStamp = '', stampCount = 0;
function stamp(){
  const d = new Date(), z = v => String(v).padStart(2, '0');
  const t = d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '_' + z(d.getHours()) + '-' + z(d.getMinutes()) + '-' + z(d.getSeconds());
  // several photos within one second get -2, -3, ... so none is overwritten
  stampCount = t === lastStamp ? stampCount + 1 : 1; lastStamp = t;
  return stampCount > 1 ? t + '-' + stampCount : t;
}
async function handleShot(blob, thumb){
  if (!blob) { toast(t('shotFail')); return; }
  const name = 'zwart-gat_' + stamp() + '.jpg';
  const wantLocal = shotLocal.checked, wantQR = shotQR.checked;
  const local = wantLocal ? saveLocal(blob, name) : null;
  if (wantQR) {
    showQRWaiting(thumb);
    try {
      if (!qrConfigured()) throw new Error(t('serviceNotSet'));
      const r = await uploadShot(blob, name);
      qrHistory.unshift({page: r.page, thumb, time: new Date(), expires: r.expires || Date.now() + 24*3600e3});
      if (qrHistory.length > 20) qrHistory.length = 20;
      await showQR(0);
    } catch (e) {
      console.warn('upload failed', e);
      hideQR();
      const why = e && e.name === 'AbortError' ? t('noAnswer') : (e && e.message) || t('error');
      if (!wantLocal) { await saveLocal(blob, name); toast(t('upFailSaved', {why})); }
      else toast(t('upFailAlso', {why}));
      return;
    }
  }
  if (local) { const msg = await local; if (!wantQR) toast(msg); }
}
// save on this computer; returns a message for the user
async function saveLocal(blob, name){
  if (shotDir) {
    try {
      if (await shotDir.queryPermission({mode: 'readwrite'}) === 'granted') {
        let fname = name;                 // never overwrite a photo already in the folder
        for (let k = 2; await shotDir.getFileHandle(fname).then(() => true, () => false); k++) fname = name.replace('.jpg', '_' + k + '.jpg');
        const fh = await shotDir.getFileHandle(fname, {create: true}), w = await fh.createWritable();
        await w.write(blob); await w.close();
        return t('savedIn', {dir: shotDir.name, file: fname});
      }
    } catch (e) { console.warn('saving in the folder failed', e); }
  }
  const a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return t('savedDl', {file: name});
}
function serviceUrl(path){ return qrBase.value.trim().replace(/\/+$/, '') + path; }
async function callService(path, opts){

    const j = await r.json().catch(() => ({}));

}

// Arrow keys also take a photo (handy with a presenter remote or a big button at a booth);
// Q shows recent QR codes again; Escape hides the QR code. Not while a slider, menu or
// text field has the focus: there these keys keep their usual job.
document.addEventListener('keydown', e => {
  if (!shotsOn.checked || picking || e.repeat || e.altKey || e.ctrlKey || e.metaKey || !el('pinPad').hidden) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))) return;
  // arrow keys, and PageUp/PageDown, which is what most presenter remotes send
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown'].includes(e.key)) { e.preventDefault(); takeShot(); }
  else if ((e.key === 'q' || e.key === 'Q') && shotQR.checked && el('qrAgainOn').checked) { e.preventDefault(); showQrAgain(); }
  else if (e.key === 'Escape') { hideQR(); hideInfo(); if (countCancel) countCancel(); }

// ---------- render loop ----------
let plateMs = 0;
function frame(){
  resize();
  if (useVideo && video.readyState >= 2 && video.videoWidth && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    upload(camTex, video);
    const a = video.videoHeight/video.videoWidth;
    if (Math.abs(a - camAspect) > 1e-6) { camAspect = a; dirty = true; }
    const m = bgMode.value;
    try {
      if (usesPlate()) { const t = performance.now(); plateStep(); plateMs = 0.9*plateMs + 0.1*(performance.now() - t); }
      else if (m === 'ai') sizeProc();
      if (worker && workerReady && !workerBusy && (m === 'ai' || m === 'booth')) sendAI();
    } catch (e) { console.error(e); }
  }
  const W = canvas.width, H = canvas.height;
  gl.viewport(0, 0, W, H);
  if (picking || (showMask.checked && bgMode.value !== 'off')) {
    setUniforms(progRaw); bindTextures(); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else if (progMap && allocMap(W, H)) {
    if (dirty) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, mapFbo);
      setUniforms(progMap); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      dirty = false;
    }
    setUniforms(progDisp); bindTextures(); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else {
    setUniforms(progDirect); bindTextures(); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  if (shotPending) grabShot();
  requestAnimationFrame(frame);
}
// timings for checking a booth computer (console: zgcStats())

(function fpsTick(){ fpsCount++; const now = performance.now();
  if (now - fpsT0 >= 2000) { fpsNow = Math.round(fpsCount*1000/(now - fpsT0)); fpsCount = 0; fpsT0 = now; }
  requestAnimationFrame(fpsTick); })();
window.zgcStats = () => {
  const pct = (a, test) => a ? Math.round(100*a.reduce((s, v) => s + (test(v) ? 1 : 0), 0)/a.length) + '%' : '-';
  return {fps: fpsNow, maskMs: +plateMs.toFixed(1), networkMs: +aiMs.toFixed(0), network: workerModel, on: aiDelegateNote, ready: workerReady, error: workerError,
    shownAsPerson: pct(pbin, v => v), networkPerson: pct(aiMask, v => v > 0.5), backgroundUnknown: pct(bCount, v => v < 3)};
};

  if (!confirm(t('resetConfirm'))) return;
  try { localStorage.removeItem(KEY); localStorage.removeItem(PIN_KEY); } catch (e) {}
  await idbSet('ownBackdrop', null).catch(() => {}); await idbSet('shotDir', null).catch(() => {});
  location.reload();
});
updateRememberNote();

// ---------- language buttons: redraw every text ----------
function setLang(l){
  if (!TXT[l] || l === lang) return;
  lang = l; applyStaticText();
  labels(); updateNote(); updateShotUI(); qrSecLabel(); updateRememberNote(); updateCamUI(); updatePinUI();
  setPanelHidden(panel.classList.contains('hidden'));
  if (bdNoteFn) bdNote(bdNoteFn);
  listCams();
  demo = makeDemo(); if (!useVideo) upload(camTex, demo);
  save();
}
document.querySelectorAll('.langs [data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

// the picture can be lost (graphics driver reset, laptop waking up): start again, with
// the same settings (they are remembered)
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail(t('glLost')); setTimeout(() => location.reload(), 1500); });

updateCamUI(); listCams();
bgChanged(); backdropChanged(); updateShotUI();
if (camWanted) startCamera(true);               // camera was on last time
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
