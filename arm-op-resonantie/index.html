<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Een spiegel stilhouden tot op een duizendste van een proton</title>
<meta name="description" content="Probeer zelf een arm van 10 km van de Einstein Telescope vol licht te houden terwijl de grond trilt, laat een regelaar het doen, spot een zwaartekrachtgolf en zoom naar de echte schaal.">
<style>
/* Layout: one viewport. Header, tab row, then stage + side panel (caption and controls) + one plot. Other content behind tabs. */
:root{
  --bg:#0d141b; --surface:#131c25; --table:#101922; --hole:#1d2934;
  --ink:#e4ebf1; --muted:#93a3b2; --line:#2a3846;
  --beam:#ff6457; --signal:#3ec5cb; --hl:#3ec5cb; --warn:#e3a54a; --gw:#b597ff; color-scheme:dark;
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#eef1f4; --surface:#f9fbfc; --table:#e2e7ec; --hole:#c8d1d9;
  --ink:#16202a; --muted:#5b6977; --line:#c3ccd5;
  --beam:#d2302a; --signal:#0d7c84; --hl:#0d7c84; --warn:#a8650f; --gw:#6a3fb5; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body:not(.lvl2) .l2{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1500px;margin:0 auto;padding:46px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.eyebrow{font:500 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--signal)}
h1{font:750 clamp(22px,2.6vw,34px)/1.12 var(--f-display);margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}
.toprow{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:thin}
.tabs button{flex:none;font:600 15px var(--f-body);background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;min-height:46px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.hdr-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:6px}
.pills{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.pills button{font:600 14px var(--f-body);background:transparent;color:var(--muted);border:0;padding:8px 13px;cursor:pointer;min-height:40px}
.pills.lang button{font-family:var(--f-mono)}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"stage side" "plot side";gap:12px;align-items:start}
.stagebox{grid-area:stage;min-width:0}
.stage{border:1px solid var(--line);border-radius:10px;background:var(--table);overflow:hidden;width:min(100%,max(440px,calc((100vh - 400px)*2.105)));margin:0 auto}
#stage{display:block;width:100%;aspect-ratio:800/380;touch-action:pan-y}
#stage.grab{cursor:ew-resize}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.plotcard{grid-area:plot;display:grid;gap:8px}
.ptabs{display:flex;flex-wrap:wrap;gap:6px}
.ptabs button{font:600 14px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.ptabs button[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.plot{display:block;width:100%;height:clamp(100px,16vh,190px)}
.side{grid-area:side;display:grid;gap:12px;align-content:start;min-width:0}
.caption{display:grid;gap:6px}
.caption h2{font:700 21px/1.2 var(--f-display);margin:0;text-wrap:balance}
.caption p{margin:0;font-size:17px;line-height:1.45}
.takeaway{font-weight:650;color:var(--signal)}
.panel{display:grid;gap:10px}
.btn{font:600 15px var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--signal);color:#041014;border-color:var(--signal)}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn.gw{border-color:var(--gw);color:var(--gw)}
.btn:disabled{opacity:.5;cursor:default}
.meter{display:grid;gap:6px}
.meter-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.meter-top b{font:700 34px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--beam)}
.meter-top span{font-size:15px;color:var(--muted)}
.meter-top .tleft{margin-left:auto;font-family:var(--f-mono)}
.meter-bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter-bar i{display:block;height:100%;width:0;background:var(--beam);border-radius:6px}
.ctl{display:grid;gap:4px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.ctl output{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ctl.off{opacity:.45}
input[type=range]{width:100%;accent-color:var(--signal)}
.bigrange{-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0}
.bigrange::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--line)}
.bigrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;background:var(--signal);margin-top:-12px;border:3px solid var(--surface)}
.bigrange::-moz-range-track{height:10px;border-radius:5px;background:var(--line)}
.bigrange::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--signal);border:3px solid var(--surface)}
.transport{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;overflow:hidden;font:500 13px var(--f-mono);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:7px 10px;cursor:pointer;min-height:36px}
.chip[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.chip .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--signal);width:0}
.status{display:flex;align-items:center;gap:8px;font:600 15px var(--f-body)}
.pill{font:600 13px var(--f-mono);letter-spacing:.04em;padding:4px 10px;border-radius:999px;border:1px solid currentColor}
.pill[data-s="off"]{color:var(--muted)} .pill[data-s="acquire"]{color:var(--warn)} .pill[data-s="locked"]{color:var(--signal)} .pill[data-s="lost"]{color:var(--beam)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ro{border-top:1px solid var(--line);padding-top:6px}
.ro b{display:block;font:500 20px var(--f-mono);font-variant-numeric:tabular-nums}
.ro span{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 14px var(--f-body);background:transparent;color:var(--muted);border:0;padding:8px 6px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.switch{display:flex;align-items:center;justify-content:space-between;width:100%;font:600 15px var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-height:46px}
.switch .knob{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--signal)}
.switch[aria-checked="true"] .knob::after{transform:translateX(16px)}
/* true scale */
.scale{display:grid;gap:12px}
.scale-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.scale h2,.more h2{font:700 clamp(20px,2.4vw,28px)/1.2 var(--f-display);margin:0;text-wrap:balance}
.lede{margin:0;max-width:85ch;color:var(--muted)}
.tourcap{font-size:18px;line-height:1.45;margin:0;min-height:2.9em;max-width:85ch}
.scale-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.scale-main,.scale-side{display:grid;gap:10px;min-width:0}
#pscale{display:block;width:100%;aspect-ratio:16/9;max-height:max(260px,calc(100vh - 400px));border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.filtbox{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;transition:border-color .3s}
.filtbox.hl{border-color:var(--gw);box-shadow:0 0 0 1px var(--gw)}
.filtbox h3,.scale-side h3{margin:0;font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#pfilt{display:block;width:100%;height:220px}
#zlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
#zlist li{display:grid;grid-template-columns:10px 1fr;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
#zlist li .sw{width:10px;height:10px;border-radius:2px;align-self:center}
#zlist li b{font-weight:600}
#zlist li small{display:block;color:var(--muted);font:500 12px var(--f-mono)}
#zlist li[data-v="in"] small{color:var(--signal)}
.small{font-size:14px;color:var(--muted);margin:0;max-width:95ch}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.n{white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.more{display:grid;gap:10px;max-width:95ch}
.more h3{margin:8px 0 0;font:700 17px var(--f-display)}
.more p,.more li,.more dd{font-size:16px}
.more ul{margin:0;padding-left:20px;display:grid;gap:6px}
.more dl{margin:0;display:grid;gap:6px}
.more dt{font-weight:650}
.more dd{margin:0 0 4px;color:var(--muted)}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "side" "plot"}.stage{width:100%}.scale-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:619px){#stage{aspect-ratio:4/3}h1{font-size:22px}.tabs button{padding:10px 9px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.switch .knob,.switch .knob::after,.filtbox{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" data-i="eyebrow">Einstein Telescope · een arm van 10 km op resonantie houden</div>
    <h1 data-i="title">Een spiegel stilhouden tot op een duizendste van een proton</h1>
  </header>
  <div class="toprow">
    <nav class="tabs" role="tablist" aria-label="Onderdelen">
      <button role="tab" id="tab-challenge" aria-selected="true">Uitdaging</button><button role="tab" id="tab-film" aria-selected="false">Film</button><button role="tab" id="tab-play" aria-selected="false">Zelf proberen</button><button role="tab" id="tab-scale" aria-selected="false">Hoe klein?</button><button role="tab" id="tab-more" aria-selected="false">Voor experts</button>
    </nav>
    <div class="hdr-ctl">
      <div class="pills" role="group" id="lvl-group"><button id="lv1" aria-pressed="true">Eenvoudig</button><button id="lv2" aria-pressed="false">Hoe het echt werkt</button></div>
      <div class="pills lang" role="group" aria-label="Taal / Language / Langue"><button id="lang-nl" aria-pressed="true">NL</button><button id="lang-en" aria-pressed="false">EN</button><button id="lang-fr" aria-pressed="false">FR</button></div>
    </div>
  </div>

  <main id="v-main" class="main">
    <div class="stagebox"><div class="stage"><canvas id="stage" role="img" aria-label=""></canvas></div></div>
    <div class="card plotcard">
      <div class="ptabs" role="group"><button id="pt-light" aria-pressed="true"></button><button id="pt-err" class="l2" aria-pressed="false"></button><button id="pt-sig" aria-pressed="false"></button></div>
      <canvas class="plot" id="pstrip"></canvas><canvas class="plot" id="perr" hidden></canvas><canvas class="plot" id="pout" hidden></canvas>
    </div>
    <aside class="side">
      <section class="card caption" aria-live="polite"><h2 id="cap-h"></h2><p id="cap-p"></p><p class="takeaway" id="cap-t" hidden></p></section>
      <div class="card panel" id="pn-ch">
        <div class="meter">
          <div class="meter-top"><b id="meter-v">0%</b><span id="meter-l"></span><span class="tleft" id="meter-t"></span></div>
          <div class="meter-bar"><i id="meter-fill"></i></div>
        </div>
        <div class="ctl" id="man-wrap"><label for="man"><span id="man-l"></span></label><input id="man" class="bigrange" type="range" min="-2" max="2" step="0.002" value="0"></div>
        <button class="btn primary big" id="ch-next"></button>
        <button class="btn big" id="ch-scale" hidden></button>
        <button class="btn" id="ch-again"></button>
      </div>
      <div class="card panel" id="pn-film" hidden>
        <div class="transport"><button class="btn primary" id="play" aria-label="▶ / ❚❚">▶</button><button class="btn" id="restart" data-i="restart">↺ Opnieuw</button></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="card panel" id="pn-play" hidden>
        <div class="status"><span data-i="status">Status</span><span class="pill" id="pill" data-s="off"></span></div>
        <div class="readouts">
          <div class="ro"><b id="ro-p">100%</b><span id="ro-p-l"></span></div>
          <div class="ro l2"><b id="ro-w">0,00</b><span id="ro-w-l"></span></div>
        </div>
        <button class="switch" id="lock" role="switch" aria-checked="false"><span id="lock-l"></span><span class="knob"></span></button>
        <div class="ctl"><label for="amp"><span data-i="ampLbl"></span><output id="amp-o"></output></label><input id="amp" type="range" min="0" max="3" step="0.05" value="1.6"></div>
        <div class="ctl l2"><label for="gain"><span data-i="gainLbl"></span><output id="gain-o"></output></label><input id="gain" type="range" min="0" max="1" step="0.01" value="0.6"></div>
        <div class="seg l2" role="group"><button id="v-arm" aria-pressed="true"></button><button id="v-full" aria-pressed="false"></button></div>
        <button class="btn gw big" id="gwbtn" data-i="gwBtn"></button>
      </div>
    </aside>
  </main>

  <section id="v-scale" class="card scale" hidden>
    <div class="scale-head"><h2 data-i="secTitle"></h2><button class="btn primary" id="tourbtn"></button></div>
    <p class="lede" data-i="secLede"></p>
    <p class="tourcap" id="tourcap" aria-live="polite"></p>
    <p class="takeaway" id="tourtk" data-i="takeaway" hidden></p>
    <div class="scale-grid">
      <div class="scale-main">
        <canvas id="pscale" role="img" aria-label=""></canvas>
        <div class="ctl"><label for="zoom"><span data-i="zoomLbl"></span><output id="zoom-o"></output></label><input id="zoom" type="range" min="-4.6" max="18" step="0.01" value="-4.4"></div>
        <div class="chips" id="zchips"></div>
      </div>
      <div class="scale-side">
        <div class="filtbox" id="filtbox"><h3 data-i="filtTitle"></h3><canvas id="pfilt" role="img" aria-label=""></canvas><p class="small" data-i="filtCap"></p></div>
        <details><summary data-i="atZoom"></summary><ul id="zlist"></ul></details>
      </div>
    </div>
    <p class="small" data-i="scaleNote"></p>
    <details><summary data-i="exTitle"></summary>
      <div class="tbl"><table id="extbl"></table></div>
      <p class="small" data-i="exNote" style="margin-top:8px"></p>
    </details>
  </section>

  <section id="v-more" class="card more" hidden>
    <h2 data-i="moreTitle"></h2>
    <p data-i="note"></p>
    <h3 data-i="simpTitle"></h3><ul id="simp"></ul>
    <h3 data-i="glossTitle"></h3><dl id="gloss"></dl>
  </section>
</div>

<script src="../shared/outreach-kit.js"></script>
<script>
(()=>{
"use strict";
/* ---------- text ---------- */
const TX={
nl:{eyebrow:"Einstein Telescope · een arm van 10 km op resonantie houden",title:"Een spiegel stilhouden tot op een duizendste van een proton",
tabs:{challenge:"Uitdaging",film:"Film",play:"Zelf proberen",scale:"Hoe klein?",more:"Voor experts"},lvl1:"Eenvoudig",lvl2:"Hoe het echt werkt",
restart:"↺ Opnieuw",gwBtn:"≋ Stuur een zwaartekrachtgolf",status:"Status",ampLbl:"Grondtrilling",gainLbl:"Servoversterking",

lb:{laser:"Laser",eom:"Fasemodulator",osc:"Oscillator",pd:"Fotodiode",mix:"Mixer",servo:"Servo",err:"foutsignaal",inm:"Ingangsspiegel",endm:"Eindspiegel",act:"Actuator",arm:"arm van 10 km (niet op schaal)",ground:"Grond / ophangpunt",trans:"Trans.",short:"te kort",res:"resonantie",long:"te lang",errS:"foutsignaal",light:"licht in arm",offset:"spiegelafwijking",locked:"vergrendeld",now:"nu",

ch1:[
["1 · Een arm vol licht","Elke arm van de Einstein Telescope is 10 km lang, met een spiegel aan elk eind. Het laserlicht kaatst ertussen heen en weer. Is de lengte precies goed, dan stapelt het licht zich op en staat de arm vol licht. Elk stukje licht doorkruist de arm honderden keren, dus een piepkleine lengteverandering wordt honderden keren meegeteld."],

["1 · De arm is een resonator","Elke arm van 10 km van de Einstein Telescope is een trilholte: laserlicht kaatst heen en weer tussen twee spiegels. Als een heen-en-terug precies een geheel aantal golflengtes lang is, valt elke doorgang in fase met de volgende en stapelt het licht zich op. Dat is resonantie, en die vermenigvuldigt het vermogen in de arm honderden keren. Elk stukje licht doorkruist de arm honderden keren, dus een piepkleine lengteverandering wordt honderden keren meegeteld."],
["2 · De grond staat nooit stil","Oceaangolven, wind en verkeer doen de grond trillen. Zelfs diep onder de grond en aan slingers opgehangen bewegen de spiegels veel meer dan de resonantie toelaat. De arm licht alleen even op wanneer hij toevallig door de resonantie gaat."],
["3 · Een signaal dat de richting aangeeft","De Pound–Drever–Hall-truc: een fasemodulator (EOM) geeft de laser zwakke zijbanden. Die weerkaatsen op de arm en interfereren met de hoofdbundel op een fotodiode, en een mixer maakt daar een foutsignaal van. Dat is precies nul op resonantie, en het teken zegt of de arm te lang of te kort is."],
["4 · De lus sluiten","De servo (de regelaar) wacht op een flits van resonantie en houdt die dan vast. Hij stuurt het foutsignaal naar spoel-magneetactuatoren die de spiegel terugduwen zodra die begint te verschuiven. Kijk hoe het terugkoppelpad oplicht."],
["5 · Vergrendeld","Het ophangpunt trilt nog steeds, maar de spiegel blijft nu stil tot op een piepklein deel van de resonantiebreedte en de arm blijft vol licht. Pas met zo vastgehouden armen kan de detector de veel kleinere uitrekking van een passerende zwaartekrachtgolf voelen."],
["6 · Er passeert een zwaartekrachtgolf","Nu rolt er een golf in de ruimtetijd zelf voorbij: kijk hoe de puntjes op de tafel ademen. De golf rekt de arm uit en drukt hem samen in een stijgende ‘chirp’, zoals bij twee zwarte gaten die naar elkaar toe spiralen. De vergrendeling houdt de arm toch op resonantie, dus moet de servo de spiegel in de maat van de golf duwen. Die duw, samen met het foutsignaal, legt de golf vast."],
["7 · Twee armen, één donkere uitgang","Zoom uit naar de hele detector. Een bundelsplitser verdeelt één laser over twee armen onder een hoek, elk vergrendeld zoals je net zag. Het licht dat uit beide armen terugkomt, wordt zo samengebracht dat het elkaar bijna volledig uitdooft, en de uitgang blijft donker (een extra lus houdt dat zo). Een zwaartekrachtgolf rekt de ene arm uit terwijl hij de andere samendrukt, de twee bundels doven elkaar niet meer uit, en er flikkert licht uit de donkere uitgang in het ritme van de golf. In het driehoeksontwerp van de Einstein Telescope delen drie zulke detectoren een driehoek met armen onder 60°; hier getekend als een klassieke L."]],

explore1:["Nu jij","Stuur een zwaartekrachtgolf, zet de regelaar uit en weer aan, of laat de grond harder trillen. Zonder regelaar is er geen meting."],
explore2:["Nu jij","Stuur een zwaartekrachtgolf, wissel tussen één arm en de hele detector, zet de terugkoppeling uit en weer aan, laat de grond harder trillen of draai de servoversterking (hoe hard de servo terugduwt per stukje afwijking) omlaag tot de vergrendeling breekt. Zonder vergrendeling is er geen meting, en een zwakke servo laat de golf de armen uit resonantie duwen."],
filmEnd:["Einde van de film","Probeer het nu zelf bij ‘Uitdaging’, of kijk bij ‘Hoe klein?’ hoe klein zo’n golf echt is."],
takeaway:"Zonder regelaar geen meting: alleen met stilgehouden spiegels kan de Einstein Telescope een uitrekking van een duizendste van een proton meten, het spoor van twee zwarte gaten die ver weg botsen.",
chal:{ready:["Kun jij de arm verlicht houden?","De grond trilt en schudt de spiegel heen en weer. Alleen als de arm precies de juiste lengte heeft, staat hij vol licht. Schuif de spiegel (met de schuif of door de tekening te slepen) en houd de arm 20 seconden zo veel mogelijk verlicht."],
hand:["Houd hem verlicht!","Schuif mee met de trilling. De meter telt hoe lang de arm verlicht is."],
handDone:["{p}% van de tijd verlicht","Lastig, hè? Je ziet alleen óf er licht is, niet naar welke kant de spiegel is weggeschoven. En in de echte detector is het venster nog veel smaller."],
auto:["De regelaar doet het","Een sensor meet het licht dat terugkomt en ziet zo naar welke kant de spiegel afwijkt. De regelaar stuurt de duwer, die de spiegel terugduwt zodra hij begint te schuiven. De arm blijft vol licht."],
wave:["Er passeert een zwaartekrachtgolf","Kijk naar de puntjes op de tafel, naar de duwer en naar het signaal eronder."],
done:["Gezien?","De golf rekte de arm uit en drukte hem samen, in een stijgende ‘chirp’. De regelaar hield de arm toch vol licht door de spiegel in het ritme van de golf mee te duwen. Dat duwen is precies het signaal (paarse lijn)."],

moreTitle:"Extra voor experts",
note:"Niet op schaal. Echte spiegels verschuiven tot ongeveer een micrometer, honderden keren de breedte van de resonantie (ongeveer een nanometer), en de echte regeling houdt ze veel strakker vast dan hier. De resonantie is hier veel breder getekend en de beweging veel kleiner, zodat je beide tegelijk ziet. De zwaartekrachtgolf is nog veel sterker overdreven: een echte verandert de arm van 10 km met ongeveer een duizendste van de breedte van een proton. In de echte detector rekt de golf de ene arm uit terwijl hij de andere samendrukt, en dat verschil wordt uitgelezen.",
simpTitle:"Wat deze simulatie vereenvoudigt",
simp:["In echte detectoren wordt de gemeenschappelijke lengte van de armen vooral gevolgd door de laserfrequentie bij te sturen; de spiegels worden vooral geduwd voor het verschil tussen de armen.",
"De golf wordt uitgelezen aan de donkere uitgang, uit het verschil tussen de twee armen, en niet uit de regellus van één arm zoals in hoofdstuk 6 en in de uitdaging.",
"Het lagefrequentie-instrument van de Einstein Telescope zal licht van 1550 nm gebruiken (met gekoelde siliciumspiegels); de liniaal rekent met 1064 nm, zoals in LIGO en Virgo.",
"Of de Einstein Telescope één driehoek wordt of twee L-vormige detectoren op verschillende plaatsen, ligt nog niet vast.",
"Afmetingen en bewegingen in de animatie zijn sterk overdreven en de golf is vertraagd tot een paar trillingen per seconde; de tabel bij ‘Hoe klein?’ zegt hoeveel.",
"In de uitdaging trilt de grond minder hard dan in de film, en neemt de regelaar de arm meteen over in plaats van op een flits van resonantie te wachten."],

["EOM (elektro-optische fasemodulator)","een kristal dat de fase van het laserlicht snel laat schommelen en zo zwakke zijbanden maakt."],
["Mixer en oscillator","de mixer vermenigvuldigt het fotodiodesignaal met de oscillator die ook de EOM aanstuurt, en haalt er zo het foutsignaal uit."],
["Servo en servoversterking","de servo is de regelaar; de versterking zegt hoe hard hij terugduwt per stukje afwijking."],
["Donkere uitgang","de uitgang waar het licht uit beide armen elkaar uitdooft; een zwaartekrachtgolf laat er een beetje licht door."]]},

ch1:[
["1 · An arm full of light","Each arm of the Einstein Telescope is 10 km long, with a mirror at each end. Laser light bounces back and forth between them. When the length is just right, the light piles up and the arm fills with light. Each bit of light crosses the arm hundreds of times, so a tiny change in length is counted hundreds of times over."],
["2 · The ground never stops moving","Ocean waves, wind and traffic shake the ground. Even deep underground and hanging on pendulums, the mirrors move far too much. The arm only lights up in brief flashes, when it happens to have exactly the right length."],
["3 · A controller steps in","A sensor measures the light that comes back and tells which way the mirror has slipped. As soon as the arm flashes, the controller takes over: the pusher keeps nudging the mirror back. Watch the loop light up."],
["4 · Holding on","The ground still shakes, but the mirror now stays put and the arm stays full of light. Only then can the detector feel something far smaller still."],
["5 · A gravitational wave passes","A wave in space itself rolls through: watch the dots on the table breathe. It stretches and squeezes the arm in a rising ‘chirp’, like two black holes spiralling into each other. The controller pushes the mirror along in step with the wave, and that push is the signal. (The real detector compares two arms: one gets longer while the other gets shorter.)"]],
chip1:["1 Light","2 Ground","3 Controller","4 Holding","5 Wave"],
ch2:[
["1 · The arm is a resonator","Each 10 km arm of the Einstein Telescope is a cavity: laser light bounces back and forth between two mirrors. When the round trip is a whole number of wavelengths, every pass lines up in phase with the next and the light piles up. That is resonance, and it multiplies the power in the arm by hundreds. Each bit of light crosses the arm hundreds of times, so a tiny change in length is counted hundreds of times over."],
["2 · The ground never stops moving","Ocean waves, wind and traffic shake the ground. Even deep underground and hanging on pendulums, the mirrors drift by far more than the resonance allows. The arm only lights up in brief flashes, each time it happens to pass through resonance."],
["3 · A signal that says which way","The Pound–Drever–Hall trick: a phase modulator (EOM) adds faint sidebands to the laser. They reflect off the arm and beat with the main beam on a photodiode, and a mixer turns that into an error signal. It is exactly zero on resonance, and its sign says whether the arm is too long or too short."],
["4 · Closing the loop","The servo (the controller) waits for a flash of resonance, then grabs it. It feeds the error signal to coil–magnet actuators that push the mirror back the moment it starts to drift. Watch the feedback path light up."],
["5 · Locked","The suspension point still shakes, but the mirror now stays put to a tiny fraction of the resonance width and the arm stays full of light. Only with the arms held like this can the detector sense the far smaller stretch of a passing gravitational wave."],
["6 · A gravitational wave passes","Now a wave in spacetime itself rolls through: watch the dots on the table breathe. It stretches and squeezes the arm in a rising chirp, like two black holes spiralling into each other. The lock keeps the arm on resonance anyway, so the servo has to push the mirror in step with the wave. That push, together with the error signal, records the wave."],
["7 · Two arms, one dark output","Zoom out to the whole detector. A beamsplitter divides one laser between two arms at an angle, each locked the way you just saw. The light coming back from both arms is recombined so that it cancels almost completely, and the output stays dark (another loop holds it there). A gravitational wave stretches one arm while it squeezes the other, the two beams stop cancelling, and light flickers out of the dark port in the rhythm of the wave. In the triangle design of the Einstein Telescope, three such detectors share a triangle with 60° arms; here it is drawn as a classic L."]],
chip2:["1 Resonator","2 Ground","3 Error signal","4 Feedback","5 Locked","6 Wave","7 Two arms"],
explore1:["Your turn","Send a gravitational wave, switch the controller off and on, or shake the ground harder. Without the controller there is no measurement."],
explore2:["Your turn","Send a gravitational wave, switch between one arm and the full detector, turn the lock off and on, shake the ground harder, or lower the servo gain (how hard the servo pushes back per bit of offset) until the lock breaks. Without a lock there is no measurement, and a weak servo lets the wave knock the arms out of resonance."],
filmEnd:["End of the film","Now try it yourself under ‘Challenge’, or see under ‘How small?’ how small such a wave really is."],
takeaway:"No control, no measurement: only with its mirrors held still can the Einstein Telescope measure a stretch of a thousandth of a proton, the trace of two black holes colliding far away.",
chal:{ready:["Can you keep the arm lit?","The ground shakes the mirror back and forth. The arm only fills with light when its length is exactly right. Move the mirror (with the slider, or by dragging the picture) and keep the arm lit for as much of 20 seconds as you can."],
hand:["Keep it lit!","Follow the shaking. The meter counts how long the arm is lit."],
handDone:["Lit {p}% of the time","Tricky, isn’t it? You only see whether there is light, not which way the mirror has slipped. And in the real detector the window is far narrower still."],
auto:["The controller does it","A sensor reads the light that comes back and can tell which way the mirror is off. The controller drives the pusher, which nudges the mirror back the moment it starts to slip. The arm stays full of light."],
wave:["A gravitational wave is passing","Watch the dots on the table, the pusher, and the signal below."],
done:["Did you spot it?","The wave stretched and squeezed the arm in a rising ‘chirp’. The controller kept the arm lit by pushing the mirror along in step with the wave. That push is the signal (purple line)."],

note:"Not to scale. Real mirrors drift by up to around a micrometre, hundreds of times the width of the resonance (about a nanometre), and the real lock holds them far more tightly than shown. Here the resonance is drawn much wider and the motion much smaller so you can see both at once. The gravitational wave is exaggerated even more: a real one changes the 10 km arm by about a thousandth of the width of a proton. In the real detector the wave stretches one arm while squeezing the other, and that difference is what gets read out.",
simpTitle:"What this simulation simplifies",
simp:["Real detectors follow the common length of the arms mainly by steering the laser frequency; the mirrors are pushed mainly for the difference between the arms.",
"The wave is read out at the dark port, from the difference between the two arms, not from one arm’s control loop as in chapter 6 and in the challenge.",
"The Einstein Telescope’s low-frequency instrument will use 1550 nm light (with cooled silicon mirrors); the ruler uses 1064 nm, as in LIGO and Virgo.",
"Whether the Einstein Telescope will be one triangle or two L-shaped detectors at separate sites is still open.",
"Sizes and motions in the animation are strongly exaggerated and the wave is slowed to a few cycles per second; the table under ‘How small?’ says by how much.",
"In the challenge the ground shakes less than in the film, and the controller takes over at once instead of waiting for a flash of resonance."],
glossTitle:"Words used in ‘How it really works’",
gloss:[["Pound–Drever–Hall (PDH)","the technique that makes an error signal saying not only how far, but also which way the arm is off resonance."],
["EOM (electro-optic phase modulator)","a crystal that makes the phase of the laser light wobble quickly, creating faint sidebands."],
["Mixer and oscillator","the mixer multiplies the photodiode signal by the oscillator that also drives the EOM, and so extracts the error signal."],
["Servo and servo gain","the servo is the controller; the gain says how hard it pushes back per bit of offset."],
["Dark port","the output where the light from both arms cancels; a gravitational wave lets a little light through."]]},

ch1:[
["1 · Un bras plein de lumière","Chaque bras de l’Einstein Telescope mesure 10 km, avec un miroir à chaque bout. La lumière laser fait des allers-retours entre les deux. Quand la longueur est parfaite, la lumière s’accumule et le bras se remplit de lumière. Chaque grain de lumière traverse le bras des centaines de fois : un infime changement de longueur est donc compté des centaines de fois."],
["2 · Le sol ne s’arrête jamais","Les vagues de l’océan, le vent et la circulation font trembler le sol. Même en profondeur et suspendus à des pendules, les miroirs bougent beaucoup trop. Le bras ne s’illumine que par brefs éclairs, quand il a par hasard exactement la bonne longueur."],
["3 · Un régulateur intervient","Un capteur mesure la lumière qui revient et indique de quel côté le miroir a glissé. Dès que le bras s’illumine, le régulateur prend la main : le pousseur ramène sans cesse le miroir en place. Regardez la boucle s’allumer."],
["4 · Tenu","Le sol tremble toujours, mais le miroir reste maintenant en place et le bras reste plein de lumière. Ce n’est qu’ainsi que le détecteur peut sentir quelque chose de bien plus petit encore."],
["5 · Une onde gravitationnelle passe","Une onde de l’espace lui-même passe : regardez les points de la table respirer. Elle étire et comprime le bras en un « chirp » qui monte, comme deux trous noirs qui spiralent l’un vers l’autre. Le régulateur pousse le miroir au rythme de l’onde, et cette poussée est le signal. (Le vrai détecteur compare deux bras : l’un s’allonge pendant que l’autre raccourcit.)"]],
chip1:["1 Lumière","2 Sol","3 Régulateur","4 Tenu","5 Onde"],
ch2:[
["1 · Le bras est un résonateur","Chaque bras de 10 km de l’Einstein Telescope est une cavité : la lumière laser fait des allers-retours entre deux miroirs. Quand un aller-retour fait exactement un nombre entier de longueurs d’onde, chaque passage est en phase avec le suivant et la lumière s’accumule. C’est la résonance, qui multiplie par des centaines la puissance dans le bras. Chaque grain de lumière traverse le bras des centaines de fois : un infime changement de longueur est donc compté des centaines de fois."],
["2 · Le sol ne s’arrête jamais","Les vagues de l’océan, le vent et la circulation font trembler le sol. Même en profondeur et suspendus à des pendules, les miroirs bougent bien plus que la résonance ne le permet. Le bras ne s’illumine que par brefs éclairs, chaque fois qu’il passe par hasard par la résonance."],
["3 · Un signal qui indique le sens","L’astuce de Pound–Drever–Hall : un modulateur de phase (EOM) ajoute au laser de faibles bandes latérales. Elles se réfléchissent sur le bras et battent avec le faisceau principal sur une photodiode, puis un mélangeur en tire un signal d’erreur. Il vaut exactement zéro à la résonance, et son signe dit si le bras est trop long ou trop court."],
["4 · Fermer la boucle","Le servo (le régulateur) attend un éclair de résonance, puis s’y accroche. Il envoie le signal d’erreur à des actionneurs bobine-aimant qui repoussent le miroir dès qu’il commence à dériver. Regardez le chemin de rétroaction s’allumer."],
["5 · Verrouillé","Le point de suspension tremble toujours, mais le miroir reste maintenant en place à une infime fraction de la largeur de résonance, et le bras reste plein de lumière. Ce n’est qu’avec des bras tenus ainsi que le détecteur peut sentir l’étirement bien plus petit d’une onde gravitationnelle."],
["6 · Une onde gravitationnelle passe","Une onde de l’espace-temps lui-même passe : regardez les points de la table respirer. Elle étire et comprime le bras en un « chirp » qui monte, comme deux trous noirs qui spiralent l’un vers l’autre. Le verrouillage garde quand même le bras en résonance : le servo doit donc pousser le miroir au rythme de l’onde. Cette poussée, avec le signal d’erreur, enregistre l’onde."],
["7 · Deux bras, une sortie sombre","Vue du détecteur entier. Une séparatrice partage un seul laser entre deux bras en angle, chacun verrouillé comme vous venez de le voir. La lumière qui revient des deux bras est recombinée de façon à s’annuler presque complètement : la sortie reste sombre (une autre boucle l’y maintient). Une onde gravitationnelle étire un bras pendant qu’elle comprime l’autre, les deux faisceaux ne s’annulent plus, et de la lumière clignote à la sortie sombre au rythme de l’onde. Dans la version en triangle de l’Einstein Telescope, trois détecteurs de ce type partagent un triangle aux bras à 60° ; ici, il est dessiné en L classique."]],

explore1:["À vous","Envoyez une onde gravitationnelle, coupez et rallumez le régulateur, ou faites trembler le sol plus fort. Sans régulateur, pas de mesure."],
explore2:["À vous","Envoyez une onde gravitationnelle, passez d’un bras au détecteur entier, coupez et rallumez le verrouillage, secouez le sol plus fort ou baissez le gain du servo (la force avec laquelle il repousse pour un écart donné) jusqu’à ce que le verrouillage lâche. Sans verrouillage, pas de mesure, et un servo trop faible laisse l’onde sortir les bras de la résonance."],
filmEnd:["Fin du film","Essayez maintenant vous-même dans « Défi », ou voyez dans « Quelle taille ? » à quel point une telle onde est petite."],
takeaway:"Sans régulation, pas de mesure : ce n’est qu’en tenant ses miroirs immobiles que l’Einstein Telescope peut mesurer un étirement d’un millième de proton, la trace de deux trous noirs qui fusionnent très loin.",

/* ---------- physics (unchanged model; S.manual adds the visitor's hand for the challenge) ---------- */
const R1=0.90,R2=0.99,OM=1.2,PMAX=1/((1-R1*R2)**2),TAU=Math.PI*2;
function refl(p){const c=Math.cos(p),s=Math.sin(p),nr=R2*c-R1,ni=R2*s,dr=1-R1*R2*c,di=-R1*R2*s,d=dr*dr+di*di;return[(nr*dr+ni*di)/d,(ni*dr-nr*di)/d]}
function circ(p){const c=Math.cos(p),s=Math.sin(p),dr=1-R1*R2*c,di=-R1*R2*s;return 1/(dr*dr+di*di)/PMAX}
function raw(p){const a=refl(p),b=refl(p+OM),c=refl(p-OM);return (a[1]*b[0]-a[0]*b[1])-(a[0]*c[1]-a[1]*c[0])}
let EMAX=0;for(let x=-3.14;x<3.14;x+=0.002)EMAX=Math.max(EMAX,Math.abs(raw(x)));
const ESG=Math.sign(raw(0.01)-raw(-0.01));
const err=p=>ESG*raw(p)/EMAX;
const FWHM=2*(1-R1*R2)/Math.sqrt(R1*R2);
const wrap=p=>p-TAU*Math.round(p/TAU);
const seisX=t=>0.9*Math.sin(TAU*.13*t+.4)+0.5*Math.sin(TAU*.31*t+1.3)+0.3*Math.sin(TAU*.71*t+2.1)+0.07*Math.sin(TAU*1.9*t+.7)+0.03*Math.sin(TAU*3.7*t+2.5);
const seisY=t=>0.9*Math.sin(TAU*.12*t+2.2)+0.5*Math.sin(TAU*.29*t+0.1)+0.3*Math.sin(TAU*.67*t+1.0)+0.07*Math.sin(TAU*2.1*t+1.9)+0.03*Math.sin(TAU*3.3*t+.4);
/* Michelson dark port: the two returning beams are recombined with a small static offset (DC readout) */
const DOFF=0.12,ASN=0.7;
function darkPort(wx,wy){const a=refl(wx),b=refl(wy),c=Math.cos(DOFF),s=Math.sin(DOFF);
  const er=(a[0]*c-a[1]*s)-(b[0]*c+b[1]*s),ei=(a[0]*s+a[1]*c)-(b[1]*c-b[0]*s);return Math.min(1,(er*er+ei*ei)/4/ASN)}
function mkArm(sf,sgn){return{sf,sgn,phiC:0,phiS:0,w:0,P:1,e:0,state:"off",low:0,lostT:0,out:null,F:{ok:false,x:0,y1:0,y2:0}}}
const X=mkArm(seisX,1),Y=mkArm(seisY,-1),ARMS=[X,Y];
const S={t:0,A:0,Atgt:0,K:30,req:false,phiG:0,gf:0,as:0,view:"arm",mix:0,hist:[],manual:false,man:0};
/* gravitational wave: inspiral chirp (f ~ (tc-t)^-3/8, amplitude ~ f^2/3) then ringdown, in slow motion; +h on arm X, -h on arm Y */
const GW={on:false,t0:0,ph:0,env:0,f0:2.5,fmax:7,Tc:3,amp:0.7};
const TCP=GW.Tc/(1-Math.pow(GW.f0/GW.fmax,8/3));
function gwStep(h){
  if(!GW.on){GW.env=0;return 0}
  const tau=S.t-GW.t0;let f,a;
  if(tau<GW.Tc){f=GW.f0*Math.pow(1-tau/TCP,-3/8);a=GW.amp*Math.pow(f/GW.fmax,2/3)*Math.min(1,tau/0.6)}
  else{f=GW.fmax;a=GW.amp*Math.exp(-(tau-GW.Tc)/0.18);if(tau>GW.Tc+1.2){GW.on=false;GW.env=0;return 0}}
  GW.ph+=TAU*f*h;GW.env=a;return a*Math.sin(GW.ph);
}
function fireGW(){GW.on=true;GW.t0=S.t;GW.ph=0;ptab="sig"}
/* arm signal: reconstructed length change (residual + servo correction), high-passed above the ground motion */
const RC=1/(TAU*1.5),G={x:0,y1:0,y2:0};
function step(dt){
  const n=32,h=dt/n,al=RC/(RC+h);
  for(let i=0;i<n;i++){
    S.t+=h; S.A+=(S.Atgt-S.A)*Math.min(1,h*1.5);
    S.phiG=gwStep(h);
    {const z1=al*(G.y1+S.phiG-G.x),z2=al*(G.y2+z1-G.y1);G.x=S.phiG;G.y1=z1;G.y2=z2;S.gf=z2}
    for(const a of ARMS){
      if(S.manual&&a===X)a.phiC+=(S.man-a.phiC)*Math.min(1,h*25); // the visitor's hand on the mirror
      a.phiS=S.A*a.sf(S.t); a.w=wrap(a.phiS+a.sgn*S.phiG+a.phiC); a.P=circ(a.w);
      a.e=err(a.w)+(Math.random()-.5)*0.04;
      if(!S.req)a.state="off"; else if(a.state==="off")a.state="acquire";
      if(a.state==="acquire"&&a.P>0.5){a.state="locked";a.low=0}
      if(a.state==="locked"){a.phiC-=S.K*a.e*h; if(a.P<0.15){a.low+=h;if(a.low>0.2){a.state="lost";a.lostT=1.2}}else a.low=0}
      if(a.state==="lost"){a.lostT-=h;if(a.lostT<=0)a.state="acquire"}
      const F=a.F;
      if(a.state==="locked"){const x=a.w-a.phiC;if(!F.ok){F.x=x;F.y1=0;F.y2=0;F.ok=true}
        const y1=al*(F.y1+x-F.x),y2=al*(F.y2+y1-F.y1);F.x=x;F.y1=y1;F.y2=y2;a.out=y2}
      else{F.ok=false;a.out=null}
    }
    S.as=darkPort(X.w,Y.w);
  }
  S.mix+=((S.view==="full"?1:0)-S.mix)*Math.min(1,dt*4);
  S.hist.push({t:S.t,P:X.P,w:X.w,wy:Y.w,L:X.state==="locked",LB:X.state==="locked"&&Y.state==="locked",
    o:X.out,d:(X.out!==null&&Y.out!==null)?(X.out-Y.out)/2:null,g:S.gf,as:S.as});
  while(S.hist.length&&S.hist[0].t<S.t-15)S.hist.shift();
}
function combinedState(){
  if(S.view!=="full")return X.state;
  const st=[X.state,Y.state];
  if(st.includes("lost"))return"lost"; if(st.includes("acquire"))return"acquire"; if(st[0]==="locked"&&st[1]==="locked")return"locked"; return"off";
}

/* ---------- films: level 2 = the full 110 s film; level 1 = 46 s, no error-signal chapter, no dark port ---------- */
const FILMS={
 2:{ch:[{k:0,s:0,e:12,hl:["cavity"]},{k:1,s:12,e:26,hl:["susp"]},{k:2,s:26,e:40,hl:["pdh"]},{k:3,s:40,e:54,hl:["loop"]},{k:4,s:54,e:72,hl:["loop","susp"]},{k:5,s:72,e:88,hl:["out"]},{k:6,s:88,e:110,hl:["dark"]}],end:110,shots:[75,93],ramp:12,lock:40,full:88},
 1:{ch:[{k:0,s:0,e:8,hl:["cavity"]},{k:1,s:8,e:18,hl:["susp"]},{k:2,s:18,e:27,hl:["loop"]},{k:3,s:27,e:33,hl:["loop","susp"]},{k:4,s:33,e:46,hl:["out"]}],end:46,shots:[35,40.5],ramp:8,lock:18,full:1e9}};
let mode="challenge",playing=true,chapter=0,shot=0,attract=false,curTab="challenge";
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function script(){
  const F=FILMS[level],t=S.t;
  if(t<F.ramp){S.Atgt=0;S.A=0;S.req=false}
  else if(t<F.lock){S.Atgt=1.6*Math.min(1,(t-F.ramp)/3);S.A=S.Atgt;S.req=false}
  else {S.Atgt=S.A=1.6;S.req=true}
  S.K=30; S.view=t>=F.full?"full":"arm";
  if(shot<F.shots.length&&t>=F.shots[shot]){shot++;fireGW()}
}
function jump(k,play){
  const F=FILMS[level];
  mode="movie";S.manual=false;S.hist=[];S.t=F.ch[k].s;S.K=30;GW.on=false;G.x=G.y1=G.y2=0;
  shot=F.shots.findIndex(x=>x>=S.t);if(shot<0)shot=F.shots.length;
  S.A=S.Atgt=S.t<F.ramp?0:1.6;
  for(const a of ARMS){a.phiC=0;a.low=0;a.lostT=0;a.F.ok=false;
    if(S.t<F.lock)a.state="off";else if(S.t===F.lock)a.state="acquire";else{a.state="locked";a.phiC=-S.A*a.sf(S.t)}}
  chapter=k;script();S.mix=S.view==="full"?1:0;ptab=(level===2&&F.ch[k].k===2)?"err":"light";
  syncControls();playing=!!play;updateUI(true);
}
function toExplore(){ mode="explore";attract=false;S.manual=false;if(level===1)S.view="arm";playing=true;syncControls();updateUI(true) }

/* ---------- challenge: keep the arm lit by hand, then let the controller do it, then spot a wave ---------- */
const CH_AMP=0.8,CH_DUR=20;
const chal={step:"ready",t:0,lit:0};
const chalPct=()=>chal.t>0?Math.round(100*chal.lit/chal.t):0;
function enterChallenge(){
  mode="challenge";attract=false;S.manual=true;S.man=0;S.req=false;S.K=30;S.view="arm";S.mix=0;GW.on=false;
  S.Atgt=S.A=CH_AMP;X.phiC=0;for(const a of ARMS){a.state="off";a.F.ok=false;a.low=0}
  chal.step="ready";chal.t=chal.lit=0;ptab="light";$("man").value="0";playing=!reduced;syncControls();updateUI(true);
}
function chalGo(){
  const s=chal.step;
  if(s==="ready"){chal.step="hand";chal.t=chal.lit=0;playing=true}
  else if(s==="handDone"){chal.step="auto";S.manual=false;S.req=true;
    for(const a of ARMS){a.phiC=-S.A*a.sf(S.t);a.state="locked";a.F.ok=false;a.low=0} // the controller takes over at once
    chal.t=chal.lit=0;ptab="light";playing=true}
  else if(s==="auto"||s==="done"){chal.step="wave";fireGW();playing=true}
  updateUI(true);
}
function chalTick(dt){
  const s=chal.step;if(s==="ready"||s==="handDone")return;
  chal.t+=dt;if(X.P>0.5)chal.lit+=dt;
  if(s==="hand"&&chal.t>=CH_DUR){chal.t=CH_DUR;chal.step="handDone";updateUI(true)}
  else if(s==="wave"&&!GW.on){chal.step="done";updateUI(true)}
}

const gainK=v=>3*Math.pow(40,v);
const gainV=K=>Math.log(K/3)/Math.log(40);
function syncControls(){
  $("lock").setAttribute("aria-checked",String(S.req));

}

}

let capKey="",lastPtab="";
function updateUI(force){
  const t=T();
  let key=(mode==="challenge"?"c"+chal.step:mode==="movie"?"m"+chapter:mode==="filmEnd"?"e":"x")+level+lang;
  if(force||key!==capKey){capKey=key;let h,p,tk=false;
    if(mode==="challenge"){const c=t.chal[chal.step];h=c[0].replace("{p}",chalPct());p=c[1];tk=chal.step==="done"}
    else if(mode==="movie"){const c=(level===1?t.ch1:t.ch2)[FILMS[level].ch[chapter].k];h=c[0];p=c[1]}
    else if(mode==="filmEnd"){h=t.filmEnd[0];p=t.filmEnd[1];tk=true}
    else {const c=level===1?t.explore1:t.explore2;h=c[0];p=c[1]}
    $("cap-h").textContent=h;$("cap-p").textContent=p;$("cap-t").textContent=t.takeaway;$("cap-t").hidden=!tk;
    const c=t.chal,s=chal.step,n=$("ch-next"),lab={ready:c.start,handDone:c.toAuto,auto:c.toWave,done:c.moreWave}[s];
    n.hidden=!lab;if(lab)n.textContent=lab;
    $("ch-scale").hidden=s!=="done";$("ch-scale").textContent=c.toScale;$("ch-again").textContent=c.again;
    $("man").disabled=!S.manual;$("man-wrap").hidden=!S.manual;
    stage.classList.toggle("grab",mode==="challenge"&&S.manual);
  }
  $("play").textContent=playing&&mode==="movie"?"❚❚":"▶";

    ctx.fillStyle=alpha(col,.12);const bw=Math.min(cx-10,half);ctx.fillRect(cx-bw,yc-7,2*bw,14);
    let x=cx+val*ppm,off=0;if(x<12){x=12;off=-1}else if(x>W-12){x=W-12;off=1}
    if(off){ctx.beginPath();ctx.moveTo(x+off*6,yc);ctx.lineTo(x-off*2,yc-7);ctx.lineTo(x-off*2,yc+7);ctx.closePath();ctx.fillStyle=col;ctx.fill()}
    else{line(ctx,[x,yc-11,x,yc+11],col,2.5);ctx.beginPath();ctx.arc(x,yc,4,0,TAU);ctx.fillStyle=col;ctx.fill()}
    text(ctx,L.tracks[id],10,y0+8,{size:12,w:600,a:"left",c:C.ink});
    let st;
    if(id==="gw"&&!GW.on)st=L.gwIdle;
    else if(half>cx)st=L.sweep.replace("{n}",fmtN(2*half/W));
    else if(half<0.5)st=L.tiny.replace("{n}","1/"+fmtN(1/half));
    else st="± "+fmtM(amp);
    text(ctx,st,narrow?10:W-10,narrow?y0+22:y0+8,{size:11,c:off||half<0.5?C.muted:col,a:narrow?"left":"right",mono:true});
  });
}
/* two traces: big slow drift with the wave hidden in it, then the fast part alone after filtering */
const pfilt=$("pfilt");
function drawFilt(){
  const W=plotW(pfilt,280,560),{ctx,H}=fit(pfilt,W),F=SC[lang].filt;
  ctx.clearRect(0,0,W,H);
  const pl=8,pr=8,rh=(H-20)/2,N=Math.round(W-pl-pr);
  const chirp=x=>{if(x<0.18)return 0;const u=(x-0.18)/0.7;const env=u<1?0.35+0.65*u:Math.exp(-(u-1)*18);return env*Math.sin(TAU*(10*u+16*u*u))};
  const noise=x=>0.09*Math.sin(TAU*53*x+1)+0.06*Math.sin(TAU*89*x+2.3)+0.05*Math.sin(TAU*131*x+.4);
  const drift=x=>0.8*Math.sin(TAU*1.2*x+.5)+0.3*Math.sin(TAU*2.7*x+1.9);
  const row=(y0,title,note,fn,col)=>{
    text(ctx,title,pl,y0+8,{size:12,w:600,a:"left",c:C.ink});
    const cy=y0+rh*0.55,amp=rh*0.28;
    line(ctx,[pl,cy,W-pr,cy],C.line,1);
    ctx.beginPath();for(let i=0;i<=N;i++){const y=cy-fn(i/N)*amp;i?ctx.lineTo(pl+i,y):ctx.moveTo(pl+i,y)}ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.stroke();
    text(ctx,note,W-pr,y0+rh-5,{size:11,c:C.muted,a:"right"});
  };
  row(0,F.r1,F.n1,x=>drift(x)+1e-4*chirp(x),C.signal);
  text(ctx,F.mid,W/2,rh+10,{size:11,w:600,c:C.gw});
  row(rh+20,F.r2,F.n2,x=>chirp(x)*0.85+noise(x),C.gw);
}
let lastList=0;
function updateScaleText(now){
  if(now-lastList<300)return;lastList=now;
  if(tour.manual)tourText();
  const L=SC[lang],cw=pscale.getBoundingClientRect().width,ppm=cw/10**(-zCur);
  $("zlist").innerHTML=REFS.map(r=>{const px=r.m*ppm;let v,s;
    if(px<1){v="small";s=L.st.small.replace("{n}",fmtN(1/px)+"×")}
    else if(px<3){v="edge";s=L.st.edge}
    else if(px>cw){v="big";s=L.st.big.replace("{n}",fmtN(px/cw)+"×")}
    else{v="in";s=L.st.in}
    return `<li data-v="${v}"><span class="sw" style="background:${C[r.c]}"></span><span><b>${L.refs[r.id]}</b> · ${fmtM(r.m)}<small>${s}</small></span></li>`}).join("");
  // exaggeration table
  const real={ground:1e-6,lock:1e-14,gw:1e-18},width=1e-9;
  const hl=S.hist.filter(p=>p.t>S.t-3&&p.L);
  const anim={ground:(S.Atgt||1.6)*1.9/FWHM,lock:hl.length>20?Math.sqrt(hl.reduce((a,p)=>a+p.w*p.w,0)/hl.length)/FWHM:null,gw:GW.amp/FWHM};
  const f=v=>v>=0.1?dec(+v.toPrecision(2)):v.toExponential(0).replace(/e([-+]\d+)/,(m,e)=>" × 10"+sup(+e)).replace(/^1 × /,"");
  $("extbl").innerHTML="<thead><tr>"+L.th.map(h=>`<th>${h}</th>`).join("")+"</tr></thead><tbody>"+["ground","lock","gw"].map(k=>{
    const rw=real[k]/width,a=anim[k];let ratio="—";
    if(a!==null&&a>0){const q=a/rw;ratio=q>=1?"≈ "+fmtN(q)+L.bigger:"≈ "+fmtN(1/q)+L.smaller}
    return `<tr><td>${L.rows[k]}</td><td class="n">≈ ${fmtM(real[k])}</td><td class="n">≈ ${f(rw)}</td><td class="n">${a===null?L.notLocked:"≈ "+f(a)}</td><td class="n">${ratio}</td></tr>`}).join("")+"</tbody>";
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(playing){
    if(mode==="movie")script();
    step(dt);
    if(mode==="movie"){
      syncControls();const F=FILMS[level];
      let c=F.ch.findIndex(c=>S.t>=c.s&&S.t<c.e); if(c<0)c=F.ch.length-1;
      if(c!==chapter){chapter=c;if(level===2&&F.ch[c].k===2)ptab="err";else if(ptab==="err")ptab="light"}
      if(S.t>=F.end){if(attract)jump(0,true);else{mode="filmEnd";syncControls();updateUI(true)}}
    }else if(mode==="challenge")chalTick(dt);
  }
  tourTick(dt);
  if(!vMain.hidden){drawStage(now);if(ptab==="light")drawStrip();else if(ptab==="err")drawErr();else drawOut();}
  if(!vScale.hidden){drawScale(dt||0.016);drawFilt();updateScaleText(now)}
  updateUI(false);
  requestAnimationFrame(frame);
}

/* ---------- start, kiosk attract loop and idle reset (shared outreach kit) ---------- */
function resetAll(){tour.on=false;tour.manual=false;attract=false;setLevel(1);setLang("nl");attract=true;showTab("film");attract=true}
if(KIT)KIT.onReset=resetAll;
window.addEventListener("pointerdown",()=>{if(attract&&document.querySelector(".ok-invite")){attract=false;setTimeout(()=>showTab("challenge"),0)}},true);
setLevel(1);setLang(lang);
if(kioskOn){showTab("film");attract=true}
else{showTab("challenge");for(let i=0;i<600;i++)step(1/60)} // pre-roll so the plot is not empty, also with reduced motion
requestAnimationFrame(frame);
})();
