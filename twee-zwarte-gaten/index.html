<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jullie zijn twee zwarte gaten</title>
<meta name="description" content="Draai met twee ballen rond elkaar en zie de zwaartekrachtgolven die jullie maken. Een interactieve opstelling over de Einstein Telescope.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed wave field; HUD floats at the edges — title + instruction top-left, controls top-right, meters along the bottom, camera preview bottom-right, settings drawer on the right. Deliberately single dark look (it is space). */
:root{
  --ink:#060a15;
  --panel:rgba(9,14,29,.82);
  --line:rgba(150,170,215,.2);
  --fg:#eaf0fa;
  --muted:#97a3bf;
  --stretch:#ffb347;
  --squeeze:#4fd2ff;
  --ballA:#ff4fb3;
  --ballB:#a4ec4c;
  --good:#7ce6a9;
  --warn:#ffd166;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-size:14px;line-height:1.4}
body{background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{touch-action:none;cursor:crosshair}

.hud{position:fixed;z-index:2;pointer-events:none}
.hud .hit{pointer-events:auto}

#top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#intro{max-width:min(46rem,70vw);display:grid;gap:10px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:rgba(255,255,255,.04)}
.chip.demo{border-color:rgba(255,179,71,.55);color:var(--stretch)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,66px);line-height:.98;letter-spacing:-.02em;text-wrap:balance;
  font-variation-settings:"opsz" 96}
h1 .a{color:var(--ballA)} h1 .b{color:var(--ballB)}
#step{margin:0;font-size:clamp(17px,1.75vw,27px);line-height:1.35;max-width:36ch;color:var(--fg);text-wrap:pretty;
  text-shadow:0 1px 18px rgba(0,0,0,.8);transition:opacity .25s}
#step.flash{opacity:.35}

#tools{display:flex;gap:8px;flex-shrink:0}
.btn{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.btn:hover{border-color:rgba(200,215,255,.45)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--squeeze);outline-offset:2px}
.btn[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.btn svg{width:18px;height:18px}

#bottom{left:0;right:0;bottom:0;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
#meters{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px)}
.meter{display:grid;gap:6px;min-width:150px}
.meter .lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.meter .lab b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .12s linear}
#mSync i{background:var(--good)}
#mAmp i{background:linear-gradient(90deg,var(--squeeze),var(--stretch))}
#mClose i{background:var(--fg)}
.read{font-family:var(--mono);font-size:13px;color:var(--muted);display:grid;gap:4px;font-variant-numeric:tabular-nums}
.read b{color:var(--fg);font-weight:500}
#legend{display:grid;gap:6px;font-size:13px;color:var(--muted);text-align:right;justify-items:end}
#legend .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
#legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#legend .sim{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}

#camBox{position:fixed;z-index:3;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 132px);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;backdrop-filter:blur(6px)}
#camBox canvas{width:240px;max-width:42vw;aspect-ratio:4/3;height:auto;border-radius:8px;display:block;cursor:crosshair;background:#000;image-rendering:pixelated}
#camBox .cap{font-family:var(--mono);font-size:11px;color:var(--muted);max-width:240px}
#camBox.calib{border-color:var(--warn)}
#camBox.calib .cap{color:var(--warn)}

#panel{position:fixed;z-index:5;top:0;right:0;bottom:0;width:min(360px,100%);overflow-y:auto;background:rgba(7,11,24,.96);border-left:1px solid var(--line);
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
#panel h2{margin:0;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em}
#panel .grp{display:grid;gap:8px}
#panel .grp > .t{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:14px;padding:9px 6px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(124,230,169,.12);color:var(--good)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw2{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.3)}
label.ck{display:flex;gap:10px;align-items:center;font-size:14px}
.rng{display:grid;gap:4px;font-size:14px}
.rng span{display:flex;justify-content:space-between;color:var(--muted)}
.rng span b{color:var(--fg);font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--good)}
#status{font-size:13px;color:var(--warn);min-height:1.2em;line-height:1.4}
.keys{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.6}
.keys kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg)}
.note{font-size:13px;color:var(--muted);line-height:1.45}

#result{position:fixed;z-index:4;inset:0;display:grid;place-items:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#card{pointer-events:auto;width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;background:rgba(7,11,24,.93);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
#card h3{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,44px);letter-spacing:-.02em;line-height:1}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .n{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--good);font-variant-numeric:tabular-nums}
.score .l{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#rRating{margin:0;font-size:18px;line-height:1.4}
.real{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.real h4{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:500}
.real p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:baseline}
.kv dt{font-size:15px;color:var(--muted);min-width:0}
.kv dd{margin:0;font-family:var(--mono);font-size:17px;color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.kv dd.big{font-size:22px;color:var(--stretch)}
.foot{font-size:12px;color:var(--muted);line-height:1.45}
.cardbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#cdown{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;flex:1;min-width:80px}
#cdown i{display:block;height:100%;background:var(--muted);width:100%}

#toast{top:calc(env(safe-area-inset-top,0px) + 74px);right:max(16px,env(safe-area-inset-right,0px));max-width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid rgba(255,209,102,.45);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;backdrop-filter:blur(6px)}
#nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);z-index:1}

@media (max-width:640px){
  #intro{max-width:100%}
  #meters{gap:14px;padding:12px}
  .meter{min-width:120px}
  #legend{text-align:left;justify-items:start}
  #legend .row{justify-content:flex-start}
  #camBox{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 150px)}
}
@media (prefers-reduced-motion:reduce){ #card{animation:none} .bar i{transition:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="field" class="layer" aria-hidden="true"></canvas>
  <canvas id="overlay" class="layer" aria-label="Speelveld"></canvas>
</div>
<div id="nogl" hidden>WebGL is not available in this browser.</div>

<div class="hud" id="top">
  <div id="intro">
    <div class="eyebrow"><span data-i18n="eyebrow"></span><span class="chip" id="modeChip"></span></div>
    <h1 id="title"></h1>
    <p id="step" aria-live="polite"></p>
  </div>
  <div id="tools">
    <button class="btn hit" id="btnSound" aria-pressed="false" title="Sound (M)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8.5a5 5 0 0 1 0 7"/><path d="M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      <span data-i18n="sound"></span>
    </button>
    <button class="btn hit" id="btnSettings" aria-expanded="false" title="Settings (S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span data-i18n="settings"></span>
    </button>
  </div>
</div>

<div class="hud" id="bottom">
  <div id="meters">
    <div class="meter" id="mSync"><div class="lab"><span data-i18n="m_sync"></span><b id="vSync">0</b></div><div class="bar"><i></i></div></div>
    <div class="meter" id="mAmp"><div class="lab"><span data-i18n="m_amp"></span><b id="vAmp">0</b></div><div class="bar"><i></i></div></div>
    <div class="meter" id="mClose"><div class="lab"><span data-i18n="m_close"></span><b id="vClose">0</b></div><div class="bar"><i></i></div></div>
    <div class="read">
      <span><b id="vOrbit">0.00</b> <span data-i18n="r_orbit"></span></span>
      <span><b id="vGw">0.00</b> <span data-i18n="r_gw"></span></span>
    </div>
  </div>
  <div id="legend">
    <div class="row">
      <span><i class="sw" style="background:var(--stretch)"></i><span data-i18n="legend_plus"></span></span>
      <span><i class="sw" style="background:var(--squeeze)"></i><span data-i18n="legend_minus"></span></span>
    </div>
    <span class="sim" data-i18n="sim"></span>
  </div>
</div>

<div id="toast" class="hud" role="status" hidden></div>
<div id="camBox" hidden>
  <canvas id="camView" width="160" height="120"></canvas>
  <div class="cap" id="camCap"></div>
</div>

<aside id="panel" hidden aria-label="Settings">
  <div class="row2" style="justify-content:space-between">
    <h2 data-i18n="settings"></h2>
    <button class="btn" id="btnClose" data-i18n="close"></button>
  </div>
  <div class="grp">
    <div class="t" data-i18n="s_mode"></div>
    <div class="seg" id="segMode">
      <button data-mode="camera" data-i18n="mode_camera"></button>
      <button data-mode="touch" data-i18n="mode_touch"></button>
      <button data-mode="demo" data-i18n="mode_demo"></button>
    </div>
    <div id="status" role="status"></div>
  </div>
  <div class="grp">
    <div class="t" data-i18n="s_lang"></div>
    <div class="seg" id="segLang"><button data-lang="nl">Nederlands</button><button data-lang="en">English</button></div>
  </div>
  <div class="grp">
    <div class="t" data-i18n="s_camera"></div>
    <div class="row2">
      <button class="btn" id="calA"><span class="sw2" id="swA"></span><span data-i18n="cal_a"></span></button>
      <button class="btn" id="calB"><span class="sw2" id="swB"></span><span data-i18n="cal_b"></span></button>
    </div>
    <label class="ck"><input type="checkbox" id="ckMirror"> <span data-i18n="s_mirror"></span></label>
    <label class="ck"><input type="checkbox" id="ckPreview"> <span data-i18n="s_preview"></span></label>
    <label class="rng"><span><span data-i18n="s_tol"></span><b id="oTol"></b></span><input type="range" id="rTol" min="8" max="45" step="1"></label>
    <label class="rng"><span><span data-i18n="s_zone"></span><b id="oZone"></b></span><input type="range" id="rZone" min="0.8" max="3.5" step="0.1"></label>
  </div>
  <div class="grp">
    <div class="t" data-i18n="s_game"></div>
    <label class="rng"><span><span data-i18n="s_touch"></span><b id="oTouch"></b></span><input type="range" id="rTouch" min="0.06" max="0.32" step="0.01"></label>
    <label class="rng"><span><span data-i18n="s_mass"></span><b id="oMass"></b></span><input type="range" id="rMass" min="50" max="600" step="10"></label>
    <button class="btn" id="btnFull" data-i18n="fullscreen"></button>
  </div>
  <div class="keys" data-i18n-html="keys"></div>
  <p class="note" data-i18n="s_note"></p>
</aside>

<div id="result" hidden>
  <div id="card" role="dialog" aria-labelledby="rTitle">
    <h3 id="rTitle"></h3>
    <div class="score"><span class="n" id="rScore">0</span><span class="l" data-i18n="res_score"></span></div>
    <p id="rRating"></p>
    <div class="real">
      <h4 data-i18n="res_real"></h4>
      <p id="rSetup"></p>
      <dl class="kv">
        <dt id="rHLab"></dt><dd class="big" id="rH"></dd>
        <dt data-i18n="res_ligo"></dt><dd>1 × 10⁻²¹</dd>
        <dt data-i18n="res_power"></dt><dd id="rP"></dd>
      </dl>
      <p id="rRatio"></p>
      <p class="foot" data-i18n="res_foot"></p>
    </div>
    <div class="cardbar"><div id="cdown"><i></i></div><button class="btn" id="btnAgain" data-i18n="res_again"></button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

/* ---------- persistent per-machine settings ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('twee-zwarte-gaten-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('twee-zwarte-gaten-' + k, JSON.stringify(v)); } catch (e) {} }
};
const DEFAULTS = {
  lang: 'nl', mode: 'camera', mirror: true, preview: true,
  tol: 22, zoneW: 1.6, touchDist: 0.16, massG: 150,
  A: { h: 328, s: 0.42, v: 0.3 },   // magenta / hot pink ball
  B: { h: 95,  s: 0.38, v: 0.28 }   // lime green ball
};
const saved = store.get('settings', {});
const S = Object.assign({}, DEFAULTS, saved, { A: Object.assign({}, DEFAULTS.A, saved.A), B: Object.assign({}, DEFAULTS.B, saved.B) });
const save = () => store.set('settings', S);

/* ---------- text ---------- */
const TXT = {
  nl: {
    eyebrow: 'Einstein Telescope · zwaartekrachtgolven',
    title: 'Jullie zijn <span class="a">twee</span> <span class="b">zwarte gaten</span>',
    sound: 'Geluid', settings: 'Instellingen', close: 'Sluiten',
    chip_demo: 'Demo', chip_camera: 'Camera', chip_touch: 'Aanraken',
    step_attract_camera: 'Pak elk een bal. Blijf stilstaan en draai de ballen samen in een cirkel, alsof je in een grote pot roert.',
    step_attract_touch: 'Zet één of twee vingers op het scherm en draai rustig rondjes.',
    step_demo: 'Twee zwarte gaten draaien om elkaar, komen dichterbij en smelten samen. Elke draai stuurt golven door de ruimte.',
    step_one: 'We zien maar één bal. Houd allebei de ballen goed in zicht.',
    step_spin: 'Draai de ballen samen in een cirkel, rond een gedeeld middelpunt.',
    step_sync: 'Blijf recht tegenover elkaar. Gelijk draaien telt, niet snel draaien.',
    step_fast: 'Rustiger! Snelheid helpt niet, samenspel wel.',
    step_good: 'Mooi samen! Kom nu heel langzaam dichter bij elkaar.',
    step_close: 'Bijna… laat de ballen elkaar zachtjes raken.',
    step_early: 'Eerst een paar mooie rondjes samen, dan pas samensmelten.',
    step_merger: 'Samensmelting! Het nieuwe zwarte gat trilt na en wordt stil.',
    step_result: 'Jullie golven reizen nu verder door het heelal.',
    m_sync: 'Samenspel', m_amp: 'Golfsterkte', m_close: 'Dichterbij',
    r_orbit: 'rondjes per seconde', r_gw: 'golven per seconde (2 per rondje)',
    legend_plus: 'ruimte rekt uit', legend_minus: 'ruimte krimpt',
    sim: 'Gesimuleerd · onvoorstelbaar uitvergroot',
    res_title: 'Samensmelting!', res_title_demo: 'Demo · nu jullie!',
    res_score: 'samenspel / 100',

function pushHist(phi, A, coh) {

/* ---------- game state ---------- */
let state = 'attract';      // attract | play | merger | result
let stateT = 0, resultFromDemo = false, earlyHint = 0, lastPresent = 0;
const emit = { phi: 0, A: 0, coh: 1, cx: 0, cy: 0, rin: 0.3 };

const stats = { t: 0, coh: 0, R: 0, revs: 0 };
const merger = { phi0: 0, w0: 0, A0: 0, cx: 0, cy: 0, sign: 1 };

let balls = null, oneBall = null;

function resetStats() { stats.t = stats.coh = stats.R = stats.revs = 0; }

function enterPlay() { state = 'play'; stateT = 0; resetAnalysis(); resetStats(); trails.A = []; trails.B = []; }

}

function realInput() {
  if (S.mode === 'demo') return null;
  const tb = touchBalls();
  if (tb) return { both: tb };
  if (S.mode === 'camera' && cam.on) {
    if (cam.A.ok && cam.B.ok) return { both: { A: { x: cam.A.x, y: cam.A.y }, B: { x: cam.B.x, y: cam.B.y } } };
    if (cam.A.ok || cam.B.ok) return { one: cam.A.ok ? { k: 'A', x: cam.A.x, y: cam.A.y } : { k: 'B', x: cam.B.x, y: cam.B.y } };
  }

}

function update(dt, now) {
  stateT += dt;

  const inp = realInput();
  if (inp) lastPresent = now;
  balls = null; oneBall = null;

  if (state === 'attract') {
    if (inp) { enterPlay(); }
    else {
      balls = demo.step(dt);
      analyse(balls.A, balls.B, dt);
      if (an.spin > 0.5) { stats.t += dt; stats.coh += an.coh * dt; stats.R += an.Rraw * dt; stats.revs += an.revs * dt; }
      if ((an.Rraw < S.touchDist && an.credit > 1.5) || demo.t > demo.T + 1) { startMerger(true); }
    }
  }
  if (state === 'play') {
    const idle = S.mode === 'camera' ? 4 : 6;
    if (!inp && now - lastPresent > idle * 1000) { enterAttract(); }
    else if (inp && inp.both) {
      balls = inp.both;
      analyse(balls.A, balls.B, dt);
      if (an.spin > 0.5) { stats.t += dt; stats.coh += an.coh * dt; stats.R += an.Rraw * dt; stats.revs += an.revs * dt; }
      if (an.Rraw < S.touchDist) {
        if (an.credit >= 2.5) startMerger(false);
        else if (an.spin < 0.5 || an.coh < 0.45) earlyHint = 2;
      }
    } else if (inp && inp.one) {

      // balls touching can hide one colour: count a lost ball right after a close, well-synchronised approach as a merger
      if (S.mode === 'camera' && an.credit >= 2.5 && cam.lastR < S.touchDist * 2 && now - cam.lastBoth < 400) startMerger(false);
    }
  }

  const follow = (state === 'play' && pointers.size) ? { x: 0, y: 0 } : { x: emit.cx * 0.8, y: emit.cy * 0.8 };

}

/* ---------- result card: score + the real numbers ---------- */
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = n => String(n).split('').map(ch => SUP[ch] || ch).join('');
function sci(x) {
  if (!(x > 0) || !isFinite(x)) return '—';
  let e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
  if (m >= 9.95) { m /= 10; e += 1; }
  return `${m.toFixed(1).replace('.', S.lang === 'nl' ? ',' : '.')} × 10${sup(e)}`;
}
function fmtInt(x) { return Math.round(x).toLocaleString(S.lang === 'nl' ? 'nl-BE' : 'en-GB'); }
function fmtDec(x, d) { return x.toFixed(d).replace('.', S.lang === 'nl' ? ',' : '.'); }

function buildResult() {
  const fromDemo = resultFromDemo;
  const T = stats.t || 1;
  const score = Math.round(100 * (stats.t > 0 ? stats.coh / T : an.coh));
  const Rbar = stats.t > 0 ? stats.R / T : an.R;          // field units
  const revs = Math.max(0.1, stats.t > 0 ? stats.revs / T : an.revs);
  // metres per field unit: camera uses the configured view width; touch/demo assume 1 m per unit
  const mPerUnit = (S.mode === 'camera' && cam.on && !fromDemo) ? S.zoneW / (2 * CS * (CW / CH)) : 1.0;
  const G = 6.674e-11, c = 2.998e8;
  const m = S.massG / 1000, mu = m / 2;                   // two equal masses: reduced mass m/2
  const d = Math.max(0.05, Rbar * mPerUnit);               // separation in metres
  const w = TAU * revs;                                    // orbital angular frequency
  const fgw = 2 * revs, lambda = c / fgw;                  // GW frequency and wavelength
  const h = 4 * G * mu * w * w * d * d / (Math.pow(c, 4) * lambda);   // optimal-orientation strain at one wavelength
  const P = (32 / 5) * G * mu * mu * Math.pow(d, 4) * Math.pow(w, 6) / Math.pow(c, 5);
  const ratioExp = Math.round(Math.log10(1e-21 / h));
  $('#rTitle').textContent = t(fromDemo ? 'res_title_demo' : 'res_title');
  $('#rScore').textContent = score;
  $('#rRating').textContent = t(score >= 85 ? 'rate4' : score >= 65 ? 'rate3' : score >= 40 ? 'rate2' : 'rate1');
  $('#rSetup').textContent = t('res_setup')(S.massG, Math.round(d * 100), fmtDec(revs, 2));
  $('#rHLab').textContent = t('res_hlab')(fmtInt(lambda / 1000), fmtDec(lambda / 3.844e8, 1));
  $('#rH').textContent = sci(h);
  $('#rP').textContent = sci(P) + ' W';
  $('#rRatio').textContent = t('res_ratio')(sup(ratioExp));
}

  updateHUD(dt);
  if (state === 'attract' || state === 'play') updateChip();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
