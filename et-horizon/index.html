<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ET-horizon</title>
<meta name="description" content="Interactief heelal in lagen: wat zie je in licht, en wat hoor je met zwaartekrachtgolven – LIGO-Virgo-KAGRA vandaag en de Einstein Telescope straks.">
<style>
/* Layout: full-bleed WebGL sky; HUD as an instrument frame — brand top-left, zoom ladder on the right edge,
   wavelength bar along the bottom like a spectrometer axis, gravitational waves set apart as "no light". */
:root{
  --bg:#03050b;
  --ink:#e8edf6;
  --ink-dim:#8f9bb3;
  --panel:rgba(8,12,24,.74);
  --line:rgba(150,170,215,.20);
  --c-radio:#d58cff;
  --c-mw:#ff8a4c;
  --c-ir:#ff5e6c;
  --c-opt:#ffe3a6;
  --c-xray:#9c8cff;
  --c-gw:#bfe6ff;
  --c-lvk:#ffb44d;
  --c-et:#3fd2c0;
  /* system fonts only: no network request, same layout offline (X3) */
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,Consolas,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;}
body{font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
canvas#gl,canvas#ov{position:fixed;inset:0;width:100%;height:100%;display:block;}
canvas#gl{touch-action:none;}
canvas#ov{pointer-events:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible{outline:2px solid var(--c-gw);outline-offset:2px;}

#hud{position:fixed;inset:0;pointer-events:none;display:grid;
  grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
#hud > *{pointer-events:auto;}
.top{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
.top > *{pointer-events:auto;}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;line-height:1;}
.brand h1 b{color:var(--c-et);font-weight:700;}
.brand p{margin:6px 0 0;color:var(--ink-dim);font-size:14px;letter-spacing:.04em;}
body.has-back .brand{padding-left:118px;} /* room for the shared "← Projecten" pill (X2) */
.chips{display:flex;gap:8px;align-items:center;}
.badge{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-lvk);border:1px solid color-mix(in srgb,var(--c-lvk) 50%,transparent);padding:6px 9px;border-radius:999px;background:var(--panel);}
.chip-btn{min-width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;}
.chip-btn svg{width:20px;height:20px;}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden;height:44px;}
.langs button{min-width:42px;padding:0 8px;font-weight:700;font-size:14px;color:var(--ink-dim);}
.langs button.on{color:var(--bg);background:var(--ink);}

.left{grid-column:1;grid-row:2;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:0;pointer-events:none;}
.left > *{pointer-events:auto;}
#caption{max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#caption h2{margin:0 0 6px;font-family:var(--f-display);font-weight:650;font-size:16px;letter-spacing:.03em;display:flex;align-items:center;gap:8px;text-wrap:balance;}
#caption h2 i{width:10px;height:10px;border-radius:50%;background:var(--cap-c,var(--c-opt));box-shadow:0 0 10px var(--cap-c,var(--c-opt));flex:none;}
#caption p{margin:0;font-size:15.5px;line-height:1.45;color:#cdd5e4;}
#caption p#cap-x{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--c-gw);}
#mission{max-width:430px;background:var(--panel);border:1px solid color-mix(in srgb,var(--c-et) 55%,transparent);border-radius:14px;padding:14px 16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#mission .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 6px;}
#mission h2{margin:0;font-family:var(--f-display);font-weight:650;font-size:17px;}
#mission .skip{font-size:14px;color:var(--ink-dim);text-decoration:underline;min-height:36px;padding:0 4px;}
#mission p{margin:0 0 10px;font-size:15.5px;line-height:1.45;color:#cdd5e4;}
#mission p b{color:var(--ink);}
#mission .go{width:100%;min-height:56px;border-radius:12px;background:var(--c-et);color:var(--bg);font-weight:800;font-size:17px;padding:6px 14px;line-height:1.2;}
#mission .steps{display:flex;gap:6px;margin:0 0 10px;}
#mission .steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);}
#mission .steps i.done{background:var(--c-et);}

#count{max-width:430px;display:flex;flex-direction:column;gap:6px;}
/* the counter is the hero (H4, H13): black holes and neutron stars apart, big numbers, filling bars */
#seen{line-height:1.25;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px;}
#seen .sh{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px;}
#seen .ct{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:10px;margin-top:6px;}
#seen .ct span{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px;}
#seen .ct span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dc);box-shadow:0 0 8px var(--dc);}
#seen .ct strong{font-family:var(--f-mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
#seen .ct em{font-style:normal;font-family:var(--f-mono);font-size:15px;color:var(--ink-dim);}
#seen .ct .meter{grid-column:1 / -1;}
#seen small{display:block;font-size:13px;color:var(--ink-dim);margin-top:6px;}
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden;}
.meter i{display:block;height:100%;width:0;background:var(--dc,var(--c-gw));transition:width .4s;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
#speed{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:14px;font-family:var(--f-mono);}
#catch{height:40px;border-radius:999px;border:1px solid var(--c-gw);color:var(--c-gw);background:var(--panel);padding:0 14px;font-size:15px;font-weight:700;}
#real{font-size:14px;color:var(--ink-dim);line-height:1.35;}
#real b{font-family:var(--f-mono);color:var(--ink);font-weight:600;}

#ladder{grid-column:2;grid-row:2;align-self:center;display:flex;flex-direction:column;gap:4px;position:relative;padding-left:14px;}
#ladder::before{content:"";position:absolute;left:4px;top:18px;bottom:18px;width:1px;background:linear-gradient(var(--line),rgba(150,170,215,.5),var(--line));}
#ladder button{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px 0 10px;border-radius:12px;font-size:14.5px;text-align:left;color:var(--ink-dim);position:relative;}
#ladder button::before{content:"";position:absolute;left:-14px;width:9px;height:9px;border-radius:50%;border:1px solid rgba(190,205,235,.6);background:var(--bg);}
#ladder button.on{color:var(--ink);background:var(--panel);}
#ladder button.on::before{background:var(--c-gw);border-color:var(--c-gw);box-shadow:0 0 10px var(--c-gw);}
#scale{font-family:var(--f-mono);font-size:13px;color:var(--ink-dim);text-align:right;margin-top:8px;padding-right:6px;}

#bar{grid-column:1 / -1;grid-row:3;display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;}
.spectrum{flex:1 1 400px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 6px;display:flex;flex-direction:column;gap:4px;}
.axis{display:flex;justify-content:space-between;padding:0 10px;font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);letter-spacing:.02em;}
.ticks{position:relative;min-height:14px;}
.ticks b{position:absolute;transform:translateX(-50%);font-weight:400;top:0;}
.ticks b::before{content:'';position:absolute;left:50%;top:13px;height:5px;border-left:1px solid var(--line);}
.axis span:first-child::before{content:"← ";}
.axis span:last-child::after{content:" →";}
.bands{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;}
.band{min-height:54px;border-radius:11px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 6px 11px;font-size:14px;font-weight:700;position:relative;line-height:1.15;text-align:center;}
.band small{font-weight:400;font-size:12px;color:var(--ink-dim);}
.band::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:3px;border-radius:2px;background:var(--bc);opacity:.35;}
.band.on{background:color-mix(in srgb,var(--bc) 22%,transparent);border-color:var(--bc);box-shadow:0 0 18px -6px var(--bc) inset;}
.band.on::after{opacity:1;box-shadow:0 0 8px var(--bc);}
.band[disabled]{opacity:.42;cursor:default;}
.gwbox{flex:0 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.gwbox .axis{justify-content:center;}
.gwbox .axis span::before,.gwbox .axis span::after{content:"" !important;}
.gwrow{display:flex;gap:6px;flex-wrap:wrap;}
#gw{--bc:var(--c-gw);min-width:150px;}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.seg button{min-height:54px;padding:0 12px;font-size:13.5px;font-weight:700;color:var(--ink-dim);border-left:1px solid var(--line);line-height:1.15;}
.seg button:first-child{border-left:0;}
.seg button.on{color:var(--bg);background:var(--sc);}
.seg button[disabled]{opacity:.42;cursor:default;}
.seg button small{display:block;font-weight:400;font-size:12px;}
.seg.off{opacity:.45;}

#event{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto;}
#event h3{margin:0 0 8px;font-family:var(--f-display);font-weight:650;font-size:16px;display:flex;justify-content:space-between;gap:8px;}
#event h3 button{width:32px;height:32px;margin:-6px -8px 0 0;font-size:20px;color:var(--ink-dim);}
#event dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px;}
#event dt{color:var(--ink-dim);}
#event dd{margin:0;font-variant-numeric:tabular-nums;}
#event .yes{color:var(--c-et);} #event .no{color:#ff8a80;}
#play{margin-top:12px;height:44px;width:100%;border-radius:10px;border:1px solid var(--c-gw);color:var(--c-gw);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;}
#play small{font-weight:400;color:var(--ink-dim);}

#attract{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);font-family:var(--f-display);font-size:14px;letter-spacing:.06em;padding:10px 18px;border-radius:999px;background:rgba(63,210,192,.14);border:1px solid var(--c-et);color:var(--ink);animation:pulse 2.4s ease-in-out infinite;pointer-events:none;white-space:nowrap;}
@keyframes pulse{50%{opacity:.55}}
@media (max-width:1180px){#attract{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;top:calc(env(safe-area-inset-top,0px) + 68px);font-size:13.5px;padding:9px 14px}} /* clear of the header chips and the caption */
#about{position:fixed;inset:0;background:rgba(2,4,10,.82);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));pointer-events:auto;}
#about .card{max-width:680px;max-height:84vh;overflow:auto;background:#0a0f1d;border:1px solid var(--line);border-radius:18px;padding:22px 24px;}
#about h2{font-family:var(--f-display);font-weight:650;font-size:18px;margin:0 0 10px;}
#about ul{padding-left:18px;margin:8px 0;line-height:1.5;font-size:15px;color:#cdd5e4;}
#about li{margin-bottom:6px;}
#about .credit{font-size:13px;color:var(--ink-dim);margin:10px 0 0;}
#about .close{margin-top:10px;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);font-weight:700;}

@media (max-width:820px){
  .brand h1{font-size:19px}
  #caption{padding:10px 12px}
  #caption p{font-size:14px}
  #ladder button{min-height:40px;font-size:13px;padding:0 8px}
  .band{min-height:46px;font-size:12.5px}
  .band small{display:none}
  .seg button{min-height:46px;font-size:12px;padding:0 8px}
  .band{font-size:14px;padding:4px 4px 11px}
  .seg button{font-size:13.5px;padding:0 7px}
  .spectrum{flex:1 1 300px}
  #gw{min-width:0;max-width:118px;hyphens:auto;-webkit-hyphens:auto}
  #seen .ct strong{font-size:22px}
  #mission{padding:10px 12px}
  #mission p{font-size:14.5px;margin-bottom:8px}
  #mission .go{min-height:52px;font-size:16px}
  #event{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 70px)}
}
@media (max-height:640px){
  .axis{display:none}
  #real{display:none} /* the same message (about one a minute, known only roughly) is in the wave caption and the info panel */
  #seen .ct strong{font-size:21px}
  #seen small{margin-top:3px}
  #caption p,#mission p{font-size:14.5px;line-height:1.38}
  #seen .ct{margin-top:3px}
}
@media (max-width:560px){
  #ladder{display:none}
  #real,#scale{display:none}
  .axis{display:none}
}
@media (prefers-reduced-motion:reduce){#attract{animation:none}}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud">
  <header class="top">
    <div class="brand"><h1><b>ET</b>-horizon</h1><p id="t-sub"></p></div>
    <div class="chips">
      <span class="badge" id="t-sim"></span>
      <div class="langs" id="langs" role="group" aria-label="Taal / Language / Langue">
        <button type="button" data-lang="nl" lang="nl">NL</button><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="fr" lang="fr">FR</button>
      </div>
      <button class="chip-btn" id="mute" type="button" aria-pressed="false"></button>
      <button class="chip-btn" id="about-btn" type="button" aria-label="Info">i</button>
    </div>
  </header>
  <div class="left">
    <section id="caption" aria-live="polite"><h2><i></i><span id="cap-h"></span></h2><p id="cap-p"></p><p id="cap-x" hidden></p></section>
    <section id="mission" aria-live="polite" hidden>
      <div class="mh"><h2 id="m-h"></h2><button type="button" class="skip" id="m-skip"></button></div>
      <div class="steps"><i></i><i></i><i></i></div>
      <p id="m-p"></p>
      <button type="button" class="go" id="m-go"></button>
    </section>
    <section id="count">
      <div id="seen"></div>
      <div class="row"><button id="catch" type="button"></button><button id="speed" type="button"></button></div>
      <div id="real"></div>
    </section>
  </div>
  <nav id="ladder" aria-label="zoom">
    <button type="button" data-z="uni"></button>
    <button type="button" data-z="web"></button>
    <button type="button" data-z="vir"></button>
    <button type="button" data-z="lg"></button>
    <button type="button" data-z="mw"></button>
    <div id="scale"></div>
  </nav>
  <footer id="bar">
    <div class="spectrum">
      <div class="axis ticks"><span id="ax-long"></span><b style="left:25%">1 mm</b><b style="left:50%" id="ax-07">0,7 µm</b><b style="left:75%" id="ax-04">0,4 µm</b><span id="ax-short"></span></div>
      <div class="bands">
        <button class="band" type="button" data-l="radio" style="--bc:var(--c-radio)" disabled hidden></button>
        <button class="band" type="button" data-l="mw" style="--bc:var(--c-mw)"></button>
        <button class="band" type="button" data-l="ir" style="--bc:var(--c-ir)"></button>
        <button class="band" type="button" data-l="opt" style="--bc:var(--c-opt)"></button>
        <button class="band" type="button" data-l="xray" style="--bc:var(--c-xray)"></button>
      </div>
    </div>
    <div class="gwbox">
      <div class="axis"><span id="ax-gw"></span></div>
      <div class="gwrow">
        <button class="band" type="button" id="gw"></button>
        <div class="seg" id="det">
          <button type="button" data-d="all" style="--sc:var(--c-gw)"></button>
          <button type="button" data-d="lvk" style="--sc:var(--c-lvk)"></button>
          <button type="button" data-d="et" style="--sc:var(--c-et)"></button>
          <button type="button" data-d="lisa" style="--sc:var(--c-radio)" disabled hidden></button>
        </div>
      </div>
    </div>
  </footer>
</div>
<section id="event" hidden>
  <h3><span id="ev-h"></span><button type="button" id="ev-x" aria-label="close">×</button></h3>
  <dl id="ev-dl"></dl>
  <button type="button" id="play"></button>
</section>

  about:`<h2>About this simulation</h2>
  <ul>

  <li><b>Light:</b> visible light to z ≈ 6, infrared (JWST) to z ≈ 14. A kilonova (the glow after a neutron-star merger) counts as ‘seen’ only when a detector also hears the merger. That is how the only one so far was found (2017): the wave told us where to look.</li>
  <li><b>Galaxies:</b> the Milky Way, Local Group and major clusters sit in roughly the right directions. The cosmic web beyond is simulated. Distances are comoving (the universe as it is now).</li>
  <li><b>Cosmology:</b> Planck 2018.</li>
  </ul><p class="credit">${CREDIT.en}</p>`,

  about:`<h2>À propos de cette simulation</h2>
  <ul>
  <li><b>Qu’est-ce qui est réel ?</b> Le rythme des collisions, la portée des détecteurs, ainsi que les distances et les époques dans l’Univers sont calculés à partir de mesures publiées. Quelle collision brille où et quand est simulé (tirages au hasard selon ces rythmes).</li>
  <li><b>Rythme :</b> cette simulation utilise 20 (trous noirs) et 100 (étoiles à neutrons) fusions par Gpc³ et par an dans l’Univers actuel. Mesures (LIGO-Virgo-KAGRA, GWTC-4.0, 2025) : trous noirs 14–26, étoiles à neutrons 7,6–250. « Environ une par minute » peut donc être en réalité quelques fois plus ou moins. Plus fréquent autrefois, comme la formation d’étoiles (Madau &amp; Dickinson 2014), ici sans délai entre formation des étoiles et fusion.</li>
  <li><b>Masses :</b> trous noirs selon une loi de puissance, dont ${n.bump} % dans un pic vers 34 masses solaires ; étoiles à neutrons vers 1,3 masse solaire. Les couples étoile à neutrons + trou noir ne sont pas inclus.</li>
  <li><b>Détecteurs :</b> sensibilité mesurée de LIGO (O4, ~150 Mpc) et de Virgo (~53 Mpc) ; pour l’Einstein Telescope, la sensibilité de conception (triangle, 10 km, ET-D). La portée d’ET pour les trous noirs lourds dépend de sa sensibilité sous 5 Hz et est plutôt optimiste. Une fusion compte comme « entendue » à partir d’un rapport signal/bruit de 10. Les cercles indiquent jusqu’où la moitié de ces fusions sont encore entendues.</li>
  <li><b>Lumière :</b> visible jusqu’à z ≈ 6, infrarouge (JWST) jusqu’à z ≈ 14. Une kilonova (la lueur après la fusion de deux étoiles à neutrons) ne compte comme « vue » que si un détecteur entend aussi la fusion. C’est ainsi que la seule observée à ce jour a été trouvée (2017) : l’onde a dit où regarder.</li>
  <li><b>Galaxies :</b> la Voie lactée, le Groupe local et les grands amas sont à peu près dans la bonne direction. La toile cosmique au-delà est simulée. Les distances sont « comobiles » (l’Univers tel qu’il est aujourd’hui).</li>

  const gwS=S.gw&&(S.det==='all'||heard);

  const vis=[];

    if(S.det!=='all'&&S.gw&&k!==2){nHeard++;mHeard=Math.max(mHeard,e.m1+e.m2);}}}

  if(vis.length)shownRatio=shownRatio*.9+.1*(1/p);
  for(const[e,k]of vis){if(Math.random()>p)continue;const i=poolI;poolI=(poolI+1)%POOL;
    fPos[i*3]=e.pos[0];fPos[i*3+1]=e.pos[1];fPos[i*3+2]=e.pos[2];fBirth[i]=now+Math.random()*dtReal;fKind[i]=k;fMag[i]=clamp(Math.log10(e.mc)/1.6,0,1);
    live.push({e,k,birth:fBirth[i]});}

      ctx.fillStyle=g;ctx.beginPath();ctx.arc(o[0],o[1],rc,0,TAU);ctx.moveTo(o[0]+r30,o[1]);ctx.arc(o[0],o[1],r30,TAU,0,true);ctx.fill();}
    const rings=[[1,t.ring.z1,.35],[6,t.ring.z6,.35],[30,t.ring.dark,.5]];
    for(const[z,label,a]of rings){const r=sphereR(DcOfZ(z),d);if(!r)continue;ctx.strokeStyle=`rgba(170,185,220,${a*uni})`;ctx.setLineDash([3,5]);ctx.lineWidth=1;ctx.beginPath();ctx.arc(o[0],o[1],r,0,TAU);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=`rgba(200,210,235,${.85*uni})`;ctx.fillText(label,o[0]-ctx.measureText(label).width/2,o[1]-r-8);}
    // infrared limit (H1): label below the centre so it does not collide with the labels above
    if(LO.ir>.01){const r=sphereR(DcOfZ(Z_IR),d);if(r){const a=LO.ir*uni;ctx.strokeStyle=`rgba(255,110,120,${.55*a})`;ctx.setLineDash([3,5]);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(o[0],o[1],r,0,TAU);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=`rgba(255,150,155,${.95*a})`;ctx.fillText(t.ring.ir,o[0]-ctx.measureText(t.ring.ir).width/2,o[1]+r+12);}}
    const rc2=sphereR(D_CMB,d);if(rc2){ctx.strokeStyle=`rgba(255,150,90,${.55*uni})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(o[0],o[1],rc2,0,TAU);ctx.stroke();
      ctx.fillStyle=`rgba(255,180,130,${.95*uni})`;ctx.fillText(t.ring.cmb,o[0]-ctx.measureText(t.ring.cmb).width/2,o[1]+rc2+12);}
    if(S.gw&&S.det==='et'){const rm=sphereR((DcOfZ(30)+D_CMB)/2,d);if(rm){ctx.font=F_BIG;ctx.fillStyle=`rgba(210,190,255,${uni})`;ctx.fillText(t.ring.q,o[0]-ctx.measureText(t.ring.q).width/2,o[1]-rm);ctx.font=F_MONO;}}
  }
  // detector reach bubbles
  for(const k of['lvk','et']){const a=LO[k];if(a<.01)continue;const col=k==='lvk'?[255,180,77]:[63,210,192];
    for(const[kind,R]of[['bbh',REACH[k].bbh*reach[k]],['bns',REACH[k].bns*reach[k]]]){
      const r=sphereR(R,d);
      if(!r){if(kind==='bbh'&&R>d){ctx.fillStyle=`rgba(${col},${.05*a})`;ctx.fillRect(0,0,w,h);}continue;}
      if(r<3)continue;
      const g=ctx.createRadialGradient(o[0],o[1],r*.6,o[0],o[1],r);g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(1,`rgba(${col},${(kind==='bbh'?.16:.1)*a})`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(o[0],o[1],r,0,TAU);ctx.fill();
      ctx.strokeStyle=`rgba(${col},${(kind==='bbh'?.9:.55)*a})`;ctx.lineWidth=kind==='bbh'?2:1.2;ctx.setLineDash(kind==='bbh'?[]:[6,4]);ctx.beginPath();ctx.arc(o[0],o[1],r,0,TAU);ctx.stroke();ctx.setLineDash([]);
      if(r>18&&r<Math.max(w,h)){const lab=`${t.bub[k]} · ${t.bub[kind]}`;ctx.fillStyle=`rgba(${col},${a})`;const ang=kind==='bbh'?-2.35:2.5;
        const lx=o[0]+r*Math.cos(ang),ly=o[1]+r*Math.sin(ang);ctx.fillText(lab,Math.max(8,lx-ctx.measureText(lab).width-6),ly);}
    }}
  // object labels
  ctx.font=F_SANS;
  for(const lb of LABELS){const a=smooth(lb.dmin*.6,lb.dmin,d)*(1-smooth(lb.dmax*.6,lb.dmax,d));if(lb.dmin===0)Object.assign(lb,{});const aa=lb.dmin===0?1-smooth(lb.dmax*.6,lb.dmax,d):a;
    if(aa<.02)continue;const s=toScreen(lb.p);if(!s)continue;const txt=lb.key==='you'?t.you:lb.key==='mw'?t.mwLabel:lb.key;
    ctx.fillStyle=`rgba(232,237,246,${.9*aa})`;ctx.beginPath();ctx.arc(s[0],s[1],2.5,0,TAU);ctx.fill();
    ctx.strokeStyle=`rgba(232,237,246,${.45*aa})`;ctx.beginPath();ctx.moveTo(s[0]+4,s[1]-4);ctx.lineTo(s[0]+16,s[1]-16);ctx.stroke();ctx.fillText(txt,s[0]+19,s[1]-18);}
  // selected event marker
  if(sel){const s=toScreen(sel.e.pos);if(s){ctx.strokeStyle='rgba(191,230,255,.95)';ctx.lineWidth=1.5;const pr=14+3*Math.sin(U.uTime.value*4);ctx.beginPath();ctx.arc(s[0],s[1],pr,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s[0]+pr*.7,s[1]-pr*.7);ctx.lineTo(s[0]+pr*.7+18,s[1]-pr*.7-18);ctx.stroke();}}
}

/* ================= attract loop ================= */
const attract={on:false,t:0,i:0};
const SCRIPT=[
 [0,()=>{Object.assign(S,{opt:true,ir:false,xray:false,mw:false,gw:false,det:'all',last:'opt'});cam.logD=Math.log(.055);cam.phi=.95;tween=null;}],
 [3,()=>flyTo('lg',3.5)],[7.5,()=>flyTo('vir',3.5)],[12,()=>flyTo('web',4)],[17,()=>flyTo('uni',4)],
 [22,()=>{S.ir=true;S.opt=false;S.last='ir';}],
 [28,()=>{S.xray=true;S.ir=false;S.last='xray';}],
 [33,()=>{S.mw=true;S.xray=false;S.last='mw';}],
 [39,()=>{S.mw=false;S.last='none';}],
 [41,()=>{S.gw=true;S.det='all';S.last='gw';}],
 [48,()=>{S.det='lvk';}],
 [56,()=>{S.det='et';}],
 [68,()=>{flyTo('mw',4);}],
 [73,null]];
function runAttract(dt){
  if(!attract.on)return;attract.t+=dt;
  while(attract.i<SCRIPT.length&&attract.t>=SCRIPT[attract.i][0]){const f=SCRIPT[attract.i][1];
    if(!f){attract.t=0;attract.i=0;continue;}f();attract.i++;resetCount();renderToggles();renderCaption();}
}
// idle reset: back to the tour, in Dutch, with the mission offered again to the next visitor
function startAttract(){attract.on=true;attract.t=0;attract.i=0;$('attract').hidden=false;sel=null;$('event').hidden=true;$('about').hidden=true;
  mission.on=false;mission.done=false;S.speedI=1;if(LANG!=='nl')setLang('nl');else renderMission();}
function userInput(){idle=0;ensureAudio();if(attract.on){attract.on=false;$('attract').hidden=true;startMission();}}

/* ================= main loop ================= */
let last=performance.now(),tNow=0;
if(QS.get('kiosk')==='1')document.body.classList.add('ok-kiosk');      // hides the shared back link on a stand
if(document.querySelector('.ok-back')&&!document.body.classList.contains('ok-kiosk'))document.body.classList.add('has-back');
renderText();renderToggles();
startAttract();updateHUD(Math.exp(cam.logD));
function frame(ts){
  const dt=Math.min(.1,(ts-last)/1000);last=ts;tNow+=dt;U.uTime.value=tNow;idle+=dt;
  if(!attract.on&&idle>75)startAttract();
  runAttract(dt);
  const d=updateCam(dt);
  // smoothed layer opacities
  const k=1-Math.pow(.02,dt);
  LO.opt+=((S.opt?1:0)-LO.opt)*k;LO.ir+=((S.ir?1:0)-LO.ir)*k;LO.xray+=((S.xray?1:0)-LO.xray)*k;LO.mw+=((S.mw?1:0)-LO.mw)*k;
  LO.lvk+=((S.gw&&S.det==='lvk'?1:0)-LO.lvk)*k;LO.et+=((S.gw&&S.det==='et'?1:0)-LO.et)*k;
  for(const q of['lvk','et']){const on=S.gw&&S.det===q;reach[q]=on?Math.min(1,reach[q]+dt/2.6):0;}
  // shell visibility by camera distance
  const fMW=1-smooth(.25,2.2,d), fLG=smooth(.02,.09,d)*(1-smooth(18,60,d)), fLoc=smooth(1.2,6,d)*(1-smooth(250,1300,d)),
        fMid=smooth(60,260,d)*(1-smooth(30000,80000,d))*(1-.55*smooth(6000,20000,d)), fFar=smooth(1500,5000,d);
  const set=(p,v)=>{p.material.uniforms.uOpacity.value=v;p.visible=v>.003;};
  set(SH.mwO,fMW*LO.opt);set(SH.mwX,fMW*LO.xray);set(SH.lgO,fLG*LO.opt);set(SH.lgX,fLG*LO.xray);
  set(SH.locO,fLoc*LO.opt*.9);set(SH.locX,fLoc*LO.xray);set(SH.midO,fMid*LO.opt);set(SH.midX,fMid*LO.xray);
  set(SH.farO,fFar*LO.opt*.75);set(SH.farX,fFar*LO.xray);
  const ir=LO.ir*(1-.45*LO.opt); // infrared on top of visible light should not just double the brightness
  set(SH.mwI,fMW*ir);set(SH.lgI,fLG*ir);set(SH.locI,fLoc*ir*.9);set(SH.midI,fMid*ir);set(SH.farI,fFar*LO.ir*.8);
  cmbMat.uniforms.uOpacity.value=LO.mw;cmb.visible=LO.mw>.003;
  simulate(dt,tNow);
  renderer.render(scene,camera);
  overlay(d);
  hudT+=dt;if(hudT>.25){hudT=0;updateHUD(d);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(QS.get('debug')==='1')window.__dbg={pick,catchOne,live,toScreen,resetCount,cnt:()=>cnt,S,renderer,SH,LO,camera,U,cam,flyTo,REACH,RATE,NUM,SHARE,startAttract,userInput,setLayer,setLang,mission,pdet,PHYS};
</script>
