/* Layout: one-screen exhibit. Full-bleed mirror stage on the left, control column on the right; stacks on phones.

:root {
  --ink: #090d15;
  --panel: #111723;
  --raise: #182031;
  --line: #26314a;
  --fg: #e8ecf4;
  --muted: #8e9ab2;
  --plus: #ffb24a;
  --cross: #5cc6ff;
  --circ: #c9a6ff;
  --warn: #ff7a6b;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--ink); }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex: 1; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: 0.01em; line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 4px 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }

.stage { position: relative; min-height: 0; overflow: hidden; background: var(--ink); touch-action: manipulation; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
.hud { position: absolute; left: 16px; top: 14px; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.hud .h { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 5vw, 58px); line-height: 0.95; }
.hud .f { font-family: var(--font-mono); font-size: 13px; color: var(--fg); opacity: .9; margin-top: 4px; }
.badge { position: absolute; right: 16px; top: 14px; text-align: right; pointer-events: none; }
.badge b { display: inline-block; font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--fg); border-radius: 3px; background: rgba(9,13,21,.6); }
.badge span { display: block; margin-top: 5px; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg); opacity: .85; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.note { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: min(520px, calc(100% - 32px)); background: rgba(17,23,35,.92); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 14px; text-align: center; pointer-events: none; transition: opacity .3s; }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: min(40vh, 300px); color: var(--fg); text-shadow: 0 4px 40px rgba(0,0,0,.6); pointer-events: none; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s ease-out; }

.panel { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding-block: 16px 24px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.label output { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--fg); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px; cursor: pointer; font-size: 14px; line-height: 1.2; }
.seg button[aria-pressed="true"] { border-color: var(--sel, var(--fg)); box-shadow: inset 0 0 0 1px var(--sel, var(--fg)); }
.seg button .sym { display: block; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; color: var(--sel, var(--fg)); }
.help { font-size: 13px; color: var(--muted); margin: 0; }
input[type=range] { width: 100%; accent-color: var(--accent, var(--plus)); }
.toggles { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border-radius: 8px; padding: 12px 14px; font-weight: 600; font-size: 15px; cursor: pointer; border: 1px solid var(--line); background: var(--raise); }
.btn.primary { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.btn.chirp { border-color: var(--circ); color: var(--fg); }
.btn:disabled { opacity: .5; cursor: default; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.srcs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.srcs button { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 7px 4px; font-size: 13px; cursor: pointer; }
.srcs button[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-weight: 600; }
details p { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.kbd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5,8,14,.78); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: min(760px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; max-width: 65ch; }
.card .fine { font-size: 13px; color: var(--muted); }
.card img { width: 100%; border-radius: 6px; border: 1px solid var(--line); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { width: auto; flex: 1 1 140px; }
.big sup { font-size: 0.5em; vertical-align: 0.9em; line-height: 0; }
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 9vw, 76px); line-height: 1; color: var(--plus); font-variant-numeric: tabular-nums; }
.heightrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.heightrow input { width: 90px; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: var(--font-mono); }
.ladder { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; font-size: 13px; }
.ladder .lbar { height: 10px; border-radius: 2px; background: var(--muted); }
.ladder .lbar.you { background: var(--plus); }
.ladder .val { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.ladder .cap { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

@media (max-width: 820px) {
  html, body { height: auto; }
  #app { display: block; height: auto; }
  .stage { height: 62svh; min-height: 340px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand small { display: none; }
  .brand h1 { font-size: 22px; }
  .badge { top: auto; bottom: 92px; }
  .note { bottom: 84px; }
}
@media (prefers-reduced-motion: reduce) { .flash, .note { transition: none; } }

  const dL = PHYS.hReal * L / 2, pp = PHYS.hReal * L, dp = 2 * PHYS.protonRadius;
  $("rv-intro").textContent = t("rvIntro", { h: sciFull(PHYS.hReal, 1), hs: dec(state.amp, 2), x: sci(exaggeration(), 1) });
  { const e = Math.floor(Math.log10(dL)), m = dL / Math.pow(10, e); $("rv-big").innerHTML = "±" + dec(m, 1) + "×10<sup>−" + (-e) + "</sup> m"; }
  $("rv-explain").textContent = t("rvExplain", { pp: sciFull(pp, 1), n: grp(round2(dp / pp)) });
  $("rv-det").textContent = t("rvDet", { ligo: sciFull(PHYS.hReal * PHYS.ligoArm / 2, 0), e10: sciFull(PHYS.hReal * PHYS.etArm10 / 2, 0), e15: sciFull(PHYS.hReal * PHYS.etArm15 / 2, 1) });
  $("rv-fine").textContent = t("rvFine"); $("rv-src").textContent = t("rvSrc");
  const rows = [[t("ladYou"), L], [t("ladHair"), 7e-5], [t("ladAtom"), 1.06e-10], [t("ladProton"), dp], [t("ladGW"), pp, true]];
  const lo = -22, hi = 1, lad = $("rv-ladder"); lad.textContent = "";
  for (const [name, v, you] of rows) {
    const a = document.createElement("div"); a.textContent = name;
    const b = document.createElement("div"); b.className = "lbar" + (you ? " you" : ""); b.style.width = Math.max(1.5, 100 * (Math.log10(v) - lo) / (hi - lo)) + "%";
    const c = document.createElement("div"); c.className = "val"; c.textContent = (v >= 0.1 ? dec(v, 2) : sciFull(v, 1)) + " m";
    lad.append(a, b, c);
  }
  const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = t("ladCap"); lad.append(cap);
}

/* ------------------------------------------------------------------ controls */
function setPol(p) { state.pol = p; for (const q of ["plus", "cross", "circ"]) $("pol-" + q).setAttribute("aria-pressed", q === p); updateStatic(); }
for (const q of ["plus", "cross", "circ"]) $("pol-" + q).addEventListener("click", () => setPol(q));
ui.amp.addEventListener("input", () => { state.amp = parseFloat(ui.amp.value); updateStatic(); });
ui.freq.addEventListener("input", () => { state.freq = parseFloat(ui.freq.value); updateStatic(); });
$("lang-nl").addEventListener("click", () => { lang = "nl"; applyLang(); });
$("lang-en").addEventListener("click", () => { lang = "en"; applyLang(); });
$("src-demo").addEventListener("click", useDemo);
$("src-photo").addEventListener("click", () => $("file").click());
$("src-camera").addEventListener("click", () => useCamera(false));
function startChirp() { if (state.chirp) return; state.chirp = { t: 0, merged: false }; state.phase = 0; state.hold = 0; state.paused = false; $("pause").textContent = t("pause"); $("chirp").disabled = true; }
$("chirp").addEventListener("click", startChirp);
$("snap").addEventListener("click", snap);
function togglePause() { state.paused = !state.paused; $("pause").textContent = state.paused ? t("play") : t("pause"); }
$("pause").addEventListener("click", togglePause);
$("reveal").addEventListener("click", () => { fillReveal(); $("reveal-sheet").hidden = false; $("reveal-close").focus({ preventScroll: true }); $("reveal-sheet").querySelector(".card").scrollTop = 0; });
$("height").addEventListener("input", fillReveal);
$("reveal-close").addEventListener("click", () => { $("reveal-sheet").hidden = true; });
$("photo-close").addEventListener("click", () => { $("photo-sheet").hidden = true; });
$("photo-again").addEventListener("click", () => { $("photo-sheet").hidden = true; snap(); });
$("photo-save").addEventListener("click", savePhoto);
for (const id of ["photo-sheet", "reveal-sheet"]) $(id).addEventListener("click", e => { if (e.target.id === id) $(id).hidden = true; });
stage.addEventListener("pointerdown", e => {
  const r = stage.getBoundingClientRect();
  state.center = [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
});
stage.addEventListener("dblclick", () => { state.center = [0.5, 0.5]; });
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input")) return;
  if (e.key === "Escape") { $("photo-sheet").hidden = true; $("reveal-sheet").hidden = true; return; }
  if (e.key === " ") { e.preventDefault(); snap(); }
  else if (e.key === "m" || e.key === "M") startChirp();
  else if (e.key === "p" || e.key === "P") togglePause();
  else if (e.key === "1") setPol("plus"); else if (e.key === "2") setPol("cross"); else if (e.key === "3") setPol("circ");
});

/* ------------------------------------------------------------------ loop */
let last = performance.now(), hudTick = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!state.paused && !busy) step(dt);
  if (!busy) {
    traceBuf.push([2 * hp, 2 * hx]); if (traceBuf.length > 300) traceBuf.shift();
    render(hp, hx);
    if ((hudTick += dt) > 0.08) { hudTick = 0; updateHUD(); }
  }
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ boot */
if (!initGL()) {
  stage.insertAdjacentHTML("beforeend", '<div class="note">WebGL2 is not available in this browser.</div>');
} else {
  resize(); useDemo(); applyLang();
  if (state.paused) $("pause").textContent = t("play");
  requestAnimationFrame(frame);
  if (document.fonts) document.fonts.ready.then(() => { demoCanvas = makeDemo(); if (state.source === "demo") { staticSrc = demoCanvas; upload(demoCanvas); } });
  useCamera(true); // live camera where the browser allows it; otherwise the demo stays
}
})();
</script>
</body></html>
